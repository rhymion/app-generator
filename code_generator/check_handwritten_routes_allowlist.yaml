# check_handwritten_routes_allowlist.yaml -- exemptions for
# code_generator/check_handwritten_routes.py
#
# Each entry names a hand-written route `path` (POSIX, relative to the project
# root), the guards it is excused from (`skip`: `permission` and/or
# `rate-limit`) and a required `reason`. An entry that no longer matches a
# flagged route is reported as stale. Consumer apps keep their own copy and
# pass it with `--allowlist`.
#
# These entries cover the routes this repository ships by hand. Several rely
# on a per-user ownership check or a credential in the request instead of a
# role permission; the ones marked "no route-level rate limit" are accepted
# gaps, not endorsements -- remove the entry when the route gains a limiter.

exemptions:
  - path: app/api/approval_request/[id]/approve/route.ts
    skip: [permission, rate-limit]
    reason: The caller must be a listed approver of the request (role and organization check in the route); no route-level rate limit.
  - path: app/api/approval_request/[id]/reject/route.ts
    skip: [permission, rate-limit]
    reason: Same approver check as approve; no route-level rate limit.
  - path: app/api/approval_request/[id]/withdraw/route.ts
    skip: [permission, rate-limit]
    reason: Only the requester may withdraw their own request; no route-level rate limit.
  - path: app/api/auth/register/route.ts
    skip: [permission]
    reason: Public sign-up; rate limited per IP (auth:register) and, with email verification on, per address (auth:register:email).
  - path: app/api/auth/register/complete/route.ts
    skip: [permission]
    reason: Second step of public sign-up with email verification; the single-use emailed token is the credential; rate limited per IP (auth:register:complete); 404 while verification is off.
  - path: app/api/auth/password-reset/route.ts
    skip: [permission]
    reason: Public password reset request (Issue #1282); answers 202 for every address; rate limited per IP (auth:password-reset) and per address (auth:password-reset:email); 404 while email verification is off.
  - path: app/api/auth/password-reset/complete/route.ts
    skip: [permission]
    reason: Second step of the password reset; the single-use emailed token is the credential, plus the TOTP or recovery code for an MFA user; rate limited per IP (auth:password-reset:complete); 404 while email verification is off.
  - path: app/api/auth/email-change/complete/route.ts
    skip: [permission]
    reason: Second step of a verified email change (Issue #1400); the single-use token mailed to the new address is the credential and names the account; rate limited per IP (auth:register:complete); 404 while email verification is off.
  - path: app/api/auth/email-change/cancel/route.ts
    skip: [permission]
    reason: Cancels a pending email change from the link in the notice to the current address; the single-use cancel token is the credential and names the account; rate limited per IP (auth:register:complete); 404 while email verification is off.
  - path: app/api/security/csp-report/route.ts
    skip: [permission]
    reason: The browser posts policy violation reports without a session; rate limited per IP (csp:report) and the route only writes a log line.
  - path: app/api/mobile/auth/refresh/route.ts
    skip: [permission, rate-limit]
    reason: The refresh token is the credential and is rotated on use; no route-level rate limit.
  - path: app/api/mobile/auth/sessions/[id]/route.ts
    skip: [permission, rate-limit]
    reason: Revokes only the calling user's own mobile session; no route-level rate limit.
  - path: app/api/mobile/auth/token/route.ts
    skip: [permission]
    reason: Sign-in endpoint; credentials in the body are the check, and it is rate limited (mobile:auth:token).
  - path: app/api/notifications/mark-read/route.ts
    skip: [permission, rate-limit]
    reason: Updates only the signed-in user's own notifications; no route-level rate limit.
  - path: app/api/test-utils/reset-caches/route.ts
    skip: [permission, rate-limit]
    reason: Disabled unless a test token is configured; clears in-process caches only.

# Hand-written files that write through Prisma directly (Issue #1257). Hand-written code writes entity rows
# through lib/<entity>/checked.ts; these files write rows that no generated service owns (authentication,
# sessions, notifications, the approval engine, attachments) or act on the caller's own account, and each
# does its own check. A new file that writes directly fails check:handwritten-routes until it is listed here
# with a reason. Consumer apps keep their own copy (--allowlist).
direct_writes:
  - path: app/[locale]/setting/mfa/actions.ts
    reason: Turns MFA on/off for the signed-in user's own account (user.update on the session user only); requires a TOTP code.
  - path: app/api/approval_request/[id]/approve/route.ts
    reason: Approval engine; the caller must be a listed approver of the request (route check); writes approval_request/approval_history/approvable, which have no generated service.
  - path: app/api/approval_request/[id]/reject/route.ts
    reason: Approval engine; same approver check as approve.
  - path: app/api/approval_request/[id]/withdraw/route.ts
    reason: Approval engine; only the requester may withdraw their own request.
  - path: app/api/auth/password-reset/complete/route.ts
    reason: Public password reset; the single-use emailed token is the credential; updates that user's password and ends their mobile sessions.
  - path: app/api/auth/register/complete/route.ts
    reason: Public sign-up (second step); the single-use emailed token is the credential; creates the user.
  - path: app/api/auth/register/route.ts
    reason: Public sign-up; creates the user (rate limited per IP and per address).
  - path: app/api/mobile/auth/refresh/route.ts
    reason: Mobile token refresh; the refresh token is the credential; rotates that session's mobile_session row.
  - path: app/api/mobile/auth/sessions/[id]/route.ts
    reason: Revokes one of the caller's own mobile sessions (filtered by user_id).
  - path: app/api/mobile/auth/token/route.ts
    reason: Mobile sign-in; password (and MFA) is the credential; creates the caller's mobile_session row.
  - path: app/api/notifications/mark-read/route.ts
    reason: Marks the caller's own notifications as read (filtered by recipient).
  - path: lib/_notifier.ts
    reason: Notification fan-out called by the generated service after a checked write; notification has no generated service.
  - path: lib/account-link/index.ts
    reason: Unlinks an OAuth account from the signed-in user's own account (filtered by user_id).
  - path: lib/approval_request/actions_core.ts
    reason: Approval engine shared by the approval Server Actions and routes; approver/requester checks are done by the callers in the same module.
  - path: lib/attachment/orphan_cleanup.ts
    reason: Scheduled task attachment_orphan_cleanup removes uploads never linked to a record; no actor.
  - path: lib/attachment/owner_cleanup.ts
    reason: Removes the attachments of a row the generated service just deleted; called after the checked delete.
  - path: lib/attachment/upload_core.ts
    reason: POST /api/upload stores a not-yet-linked file for any authenticated caller (rate limited, size/type checked); it reaches a record only when that record is saved through its own permission-checked write path, and an unlinked upload is removed by the attachment_orphan_cleanup task.
  - path: lib/auth/create-user.ts
    reason: Auth.js account creation (OAuth first sign-in, sign-up); the identity provider or the sign-up flow is the credential.
  - path: lib/auth/email-change.ts
    reason: Completes a verified email change; the single-use emailed token is the credential.
  - path: lib/idempotency.ts
    reason: Stores the response of an already-authorized API request under its Idempotency-Key; idempotency_key has no generated service.
  - path: lib/setting/api-key-actions.ts
    reason: Issues or revokes the signed-in user's own API key (user.update on the session user only).
  - path: lib/compliance/anonymize_user.ts
    reason: Generated from templates/anonymize_user.ts.jinja2 (skipped after generate-code via the manifest); listed for runs without a manifest. Its caller, the user invalidate route, checks user.delete on the record first.
