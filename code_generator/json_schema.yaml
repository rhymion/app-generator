        minimum: 0
        maximum: 4
        enum:
          - Like
          - Love
          - Laugh
          - Surprised
          - Sad
      user_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user
          labelField: name
      comment_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: comment
