        pattern: "^c[a-z0-9]{24,}$"
      dashboard_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: dashboard
          labelField: name
      name:
        type: string
        minLength: 1
      entity_name:
        type: string
        minLength: 1
      chart_type:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - pie
          - column
          - bar
          - line
        default: 1
      stack_mode:
        type:
          - integer
          - "null"
        minimum: 0
        maximum: 2
        enum:
          - grouped
          - stacked
          - standardized
      series_field:
        type:
          - string
          - "null"
      group_by_bucket:
        type:
          - integer
          - "null"
        minimum: 0
        maximum: 4
        enum:
          - day
          - week
          - month
          - quarter
          - year
      group_by_field:
        type: string
        minLength: 1
      filter_field:
        type:
          - string
          - "null"
      filter_value:
        type:
          - string
          - "null"
      order:
        type: integer
        default: 0

  dashboard_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    x-custom-components:
