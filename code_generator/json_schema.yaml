$schema: "http://json-schema.org/draft-07/schema#"
format-version: 3.0

# x-cloud: GCP Cloud Run opt-in (uncomment to use)
# x-cloud:
#   enabled: true
#   provider: gcp
#   service: cloud_run
#   region: asia-northeast1

x-generator:
  search:
    default_scope: all

# PII and Privacy Annotations
x-pii:
  type: string
  enum:
    - direct    # Directly identifies a person (name, email)
    - indirect  # Can identify when combined (image, emailVerified)
    - sensitive # Special category (GDPR Art.9) or confidential auth data
    - none      # No PII
  description: |
    PII classification for GDPR/APPI compliance.
    Used by the anonymize_user() function to determine which fields to scrub.
    Required on all user-facing fields in generated apps.

x-retention:
  type: string
  description: |
    Data retention policy for this field.
    Examples: "account_lifetime", "7_years", "30_days_after_deletion"
    Used to generate retention enforcement logic in future phases.

x-mention:
  type: boolean
  default: false
  description: |
    When true, the field supports @[user_id:uuid] mention syntax.
    The generator will include mention-parser utilities for this field.
    On render: @[user_id:xxx] is resolved to user.name (or '[deleted]' after anonymization).
    On save: @username patterns are converted to @[user_id:xxx] format.

x-gdpr-mode:
  type: string
  enum:
    - internal   # Applies to employee/internal user data only
    - consumer   # Applies to general consumer data only
    - both       # Applies to both internal and consumer data
  default: both
  description: |
    Specifies the data subject scope this model/field applies to.
    internal: employee data only
    consumer: general consumer data only
    both: applies to both scopes

x-import-key:
  type: array
  items:
    type: string
  description: |
    Natural key fields that uniquely identify a record for import (Phase 2).
    Also guarantees these columns appear in Phase 1 CSV exports when export:true (the default).
    Dual purpose: (a) own import key — suppressed by x-generate.import:false;
    (b) natural-key target for other entities' dotted-FK imports — always active.
    Single field: [name]
    Composite: [name, tenant_id]
    Dotted FK path for Phase 2: [name, role.name] (role_id resolved via role.name)
    Entities without x-import-key: export-only in Phase 1; import blocked in Phase 2.

x-payment:
  type: boolean
  default: false
  description: |
    Opt-in Stripe payment integration. When at least one entity in the
    schema declares `x-payment: true`, the generator emits three write-once
    stub files (same convention as lib/<parent>/invalidate_handler.ts --
    written only if the file does not already exist, so hand-written
    implementations survive regeneration):
      - lib/stripe.ts                     -- Stripe SDK init, fail-closed on
                                              a missing STRIPE_SECRET_KEY
      - app/api/payment/checkout/route.ts -- Checkout Session creation stub
      - app/api/webhooks/stripe/route.ts  -- Webhook receiver stub
                                              (req.text() -> constructEvent)
    The generator does NOT generate a Plan/Product/Purchase-style entity, an
    authz/entitlement layer, or any payment UI -- consumers model their own
    payment-related entities as ordinary schema entities and wire them into
    the stub routes. Scope is one-time purchases (Checkout Session
    mode: payment); subscription lifecycle handling is left to the consumer
    to add. Requires STRIPE_SECRET_KEY / STRIPE_PUBLISHABLE_KEY /
    STRIPE_WEBHOOK_SECRET env vars (see .env.example) -- the generated
    lib/stripe.ts and webhook route both throw at import time if their
    required key is unset (fail-closed; never a silent pass-through).

definitions:
  user:
    x-generate:
      list: true
      view: true
      new: false
      edit: true
      delete: false
      invalidate:
        enabled: true
        handler: anonymizeUser
        module: lib/compliance/anonymize_user
      api: true
      test: true
      search: false
      fields:
        - name
        - image
        - roles
    x-relationships:
      roles:
        type: many-to-many
        target: role
    x-custom-components:
      - name: MfaToggle
        path: "@/components/_standard/MfaToggle"
        target:
          - view
    x-import-key: [name]
    x-display:
      table:
        - name:
            primary: true
            width: 150
    fields:
      name:
        x-pii: direct
      email:
        x-pii: direct
      password:
        x-pii: sensitive
        x-custom-component:
          target:
            - upsert
      api_key:
        x-pii: sensitive
        x-custom-component:
          target:
            - upsert
      image:
        format: uri
        x-pii: indirect
      mfa_enabled:
        default: false
        x-pii: sensitive
        x-custom-component:
          target:
            - upsert

    required:
      - roles
    properties:
      roles:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/role"

  setting:
    x-generate:
      list: false
      view: true
      new: false
      edit: true
      delete: false
      invalidate: false
      api: true
      search: false
      fields:
        - name
        - email
        - image
        - password
        - api_key
        - mfa_enabled
    x-relationships:
      roles:
        type: many-to-many
        target: role
    # x-self-only (cmd_536): `setting` is a proxy view of the acting
    # user's OWN `user` row — id === creator_id always holds for every
    # real account (see lib/auth/creator-id-self-reference-guard.test.ts),
    # so creator_id is exactly the right unconditional ownership filter
    # here, same as any other x-self-only entity. admin_bypass: true lets
    # an Administrator read another user's settings for support purposes,
    # but only with an audit row written for the access (see
    # lib/self_only.ts) — this scope is entity-name-keyed (`setting`), so
    # it applies ONLY to settings pages/routes/getters and never touches
    # the `user` entity itself or any other entity's FK reference to
    # `user` (mentions, comment creators, approvers, etc. all stay fully
    # visible).
    x-self-only:
      admin_bypass: true
    allOf:
      - $ref: "#/definitions/user"
      - type: object
        required:
          - roles
        properties:
          roles:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/role"

  role:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
      search: true
    # Security-sensitive entity: every create/update/delete is recorded in
    # the audit_log table by the generated service layer.
    x-audit: true
    x-relationships:
      users:
        type: many-to-many
        target: user
    x-import-key: [name]
    fields:
      name: {}
      description: {}
    required:
      - users
    properties:
      users:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/user"

  organization:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
      search: true
    x-relationships:
      users:
        type: many-to-many
        target: user
    x-search:
      org_id_field: id
    x-import-key: [name]
    fields:
      name: {}
      description:
        x-ui:
          width: 8

    required:
      - users
    properties:
      users:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/user"

  permission:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
      search: false
    # Security-sensitive entity: every create/update/delete is recorded in
    # the audit_log table by the generated service layer.
    x-audit: true
    x-import-key: [name, role.name]
    x-display:
      table:
        - name:
            width: 200
        - role:
            width: 200
    fields:
      name:
        x-entity-select: true
      create: {}
      read: {}
      update: {}
      delete: {}
      import:
        default: false
    properties:
      role:
        $ref: "#/definitions/role"

  approval_flow:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
      search: false
    x-relationships:
      preceded_by:
        type: many-to-many
        target: approval_flow
        labelField: [entity_name, approver_role.name]
      followed_by:
        type: many-to-many
        target: approval_flow
        labelField: [entity_name, approver_role.name]
    x-import-key: [entity_name]
    x-display:
      table:
        - entity_name:
            primary: true
            width: 200
        - requestor_role:
            width: 150
        - approver_role:
            width: 150
    fields:
      entity_name:
        x-entity-select: true
    required:
      - approver_role
      - preceding_transitions
    properties:
      requestor_role:
        $ref: "#/definitions/role"
      approver_role:
        $ref: "#/definitions/role"
      preceded_by:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/approval_flow"
      followed_by:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/approval_flow"

  approval_request:
    x-display:
      table:
        - approval_flow:
            width: 200
        - status:
            width: 100
    fields:
      approvable_id:
        x-relationship:
          labelField: id
      approval_flow_id:
        x-relationship:
          labelField: entity_name
      status:
        enum:
          - pending
          - approved
          - rejected
          - terminal_rejected

  comment:
    fields:
      message:
        x-mention: true
      commentable_id: {}
  reaction:
    x-internal:
      page: false
      embed: false
      api: custom
    fields:
      type:
        enum:
          - like
          - love
          - laugh
          - surprised
          - sad
      user_id:
        x-relationship: {}
      comment_id:
        x-relationship:
          labelField: id
          constantParent: true

  attachment:
    fields:
      type:
        enum:
          - image
          - file
          - video
          - audio
        _required: true
      order:
        default: 0
      name: {}
      path:
        format: uri
      attachable_id: {}
  dashboard_widget:
    fields:
      dashboard_id:
        x-relationship: {}
      name: {}
      entity_name: {}
      chart_type:
        enum:
          - pie
          - column
          - bar
          - line
        default: column
      stack_mode:
        enum:
          - grouped
          - stacked
          - standardized
      series_field: {}
      group_by_bucket:
        enum:
          - day
          - week
          - month
          - quarter
          - year
      group_by_field: {}
      filter_field: {}
      filter_value: {}
      order:
        default: 0
  dashboard:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
      search: true
    x-search:
      text_fields: [name]
      snippet_field: name
      bigm_fields: [name]
    x-custom-components:
      - name: DashboardView
        path: "@/components/_standard/DashboardView"
        target:
          - view
    x-display:
      table:
        - name:
            primary: true
            width: 200
    fields:
      name: {}
    required:
      - widgets
    properties:
      widgets:
        type: array
        items:
          $ref: "#/definitions/dashboard_widget"

