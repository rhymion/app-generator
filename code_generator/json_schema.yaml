    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      type:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - image
          - file
          - video
          - audio
      order:
        type: integer
        default: 0
      name:
        type: string
        minLength: 1
      path:
        type: string
        format: uri
      attachable_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"

  dashboard:
    type: object
    required:
      - id
      - name
    x-display:
