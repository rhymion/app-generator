$schema: "http://json-schema.org/draft-07/schema#"
format-version: 2.0
x-generator:
  search:
    default_scope: all

# PII and Privacy Annotations
x-pii:
  type: string
  enum:
    - direct    # Directly identifies a person (name, email)
    - indirect  # Can identify when combined (image, emailVerified)
    - sensitive # Special category (GDPR Art.9) or confidential auth data
    - none      # No PII
  description: |
    PII classification for GDPR/APPI compliance.
    Used by the anonymize_user() function to determine which fields to scrub.
    Required on all user-facing fields in generated apps.

x-retention:
  type: string
  description: |
    Data retention policy for this field.
    Examples: "account_lifetime", "7_years", "30_days_after_deletion"
    Used to generate retention enforcement logic in future phases.

x-mention:
  type: boolean
  default: false
  description: |
    When true, the field supports @[user_id:uuid] mention syntax.
    The generator will include mention-parser utilities for this field.
    On render: @[user_id:xxx] is resolved to user.name (or '[deleted]' after anonymization).
    On save: @username patterns are converted to @[user_id:xxx] format.

x-gdpr-mode:
  type: string
  enum:
    - internal   # Applies to employee/internal user data only
    - consumer   # Applies to general consumer data only
    - both       # Applies to both internal and consumer data
  default: both
  description: |
    Specifies the data subject scope this model/field applies to.
    internal: employee data only
    consumer: general consumer data only
    both: applies to both scopes

x-import-key:
  type: array
  items:
    type: string
  description: |
    Natural key fields that uniquely identify a record for import (Phase 2).
    Also guarantees these columns appear in Phase 1 CSV exports when export:true (the default).
    Dual purpose: (a) own import key — suppressed by x-generate.import:false;
    (b) natural-key target for other entities' dotted-FK imports — always active.
    Single field: [name]
    Composite: [name, tenant_id]
    Dotted FK path for Phase 2: [name, role.name] (role_id resolved via role.name)
    Entities without x-import-key: export-only in Phase 1; import blocked in Phase 2.

definitions:
  user:
    x-generate:
      list: true
      view: true
      new: false
      edit: true
      delete: false
      invalidate:
        enabled: true
        handler: anonymizeUser
        module: lib/compliance/anonymize_user
      api: true
      test: true
      search: false
      fields:
        - name
        - image
        - roles
    x-relationships:
      roles:
        type: many-to-many
        target: role
    x-custom-components:
      - name: MfaToggle
        path: "@/components/_standard/MfaToggle"
        target:
          - view
    x-import-key: [name]
    x-display:
      table:
        - name:
            primary: true
            width: 150
    fields:
      name:
        x-pii: direct
      email:
        x-pii: direct
      password:
        x-pii: sensitive
        x-custom-component:
          target:
            - upsert
      api_key:
        x-pii: sensitive
        x-custom-component:
          target:
            - upsert
      image:
        format: uri
        x-pii: indirect
      mfa_enabled:
        default: false
        x-pii: sensitive
        x-custom-component:
          target:
            - upsert

    required:
      - roles
    properties:
      roles:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/role"

  setting:
    x-generate:
      list: false
      view: true
      new: false
      edit: true
      delete: false
      invalidate: false
      api: true
      search: false
      fields:
        - name
        - email
        - image
        - password
        - api_key
        - mfa_enabled
    x-relationships:
      roles:
        type: many-to-many
        target: role
    allOf:
      - $ref: "#/definitions/user"
      - type: object
        required:
          - roles
        properties:
          roles:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/role"

  role:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
      search: true
    # Security-sensitive entity: every create/update/delete is recorded in
    # the audit_log table by the generated service layer.
    x-audit: true
    x-relationships:
      users:
        type: many-to-many
        target: user
    x-import-key: [name]
    fields:
      name: {}
      description: {}
    required:
      - users
    properties:
      users:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/user"

  organization:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
      search: true
    x-relationships:
      users:
        type: many-to-many
        target: user
    x-search:
      org_id_field: id
    x-import-key: [name]
    fields:
      name: {}
      description:
        x-ui:
          width: 8

    required:
      - users
    properties:
      users:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/user"

  permission:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
      search: false
    # Security-sensitive entity: every create/update/delete is recorded in
    # the audit_log table by the generated service layer.
    x-audit: true
    x-import-key: [name, role.name]
    x-display:
      table:
        - name:
            width: 200
        - role:
            width: 200
    fields:
      name:
        x-entity-select: true
      create: {}
      read: {}
      update: {}
      delete: {}
      import:
        default: false
      role_id:
        x-relationship: {}
    properties:
      role:
        $ref: "#/definitions/role"

  approval_flow:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
      search: false
    x-relationships:
      preceded_by:
        type: many-to-many
        target: approval_flow
        labelField: entity_name
        secondaryLabelField: approver_role.name
      followed_by:
        type: many-to-many
        target: approval_flow
        labelField: entity_name
        secondaryLabelField: approver_role.name
    x-import-key: [entity_name]
    x-display:
      table:
        - entity_name:
            primary: true
            width: 200
        - requestor_role:
            width: 150
        - approver_role:
            width: 150
    fields:
      entity_name:
        x-entity-select: true
      requestor_role_id:
        x-relationship: {}
      approver_role_id:
        x-relationship: {}
    required:
      - approver_role
      - preceding_transitions
    properties:
      requestor_role:
        $ref: "#/definitions/role"
      approver_role:
        $ref: "#/definitions/role"
      preceded_by:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/approval_flow"
      followed_by:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/approval_flow"

  approval_request:
    x-display:
      table:
        - approval_flow:
            width: 200
        - status:
            width: 100
    fields:
      approvable_id:
        x-relationship:
          labelField: id
      approval_flow_id:
        x-relationship:
          labelField: entity_name
      status:
        minimum: 0
        maximum: 2
        enum:
          - Pending
          - Approved
          - Rejected

  approvable:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    fields:
      approved_at:
        _legacy_nullable_style: true
    properties:
      approval_requests:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/approval_request"

  commentable:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    properties:
      comments:
        type: array
        x-outputType: comments
        items:
          $ref: "#/definitions/comment"

  comment:
    fields:
      message:
        x-mention: true
      commentable_id: {}
  reaction:
    x-internal:
      page: false
      embed: false
      api: custom
    fields:
      type:
        minimum: 0
        maximum: 4
        enum:
          - Like
          - Love
          - Laugh
          - Surprised
          - Sad
      user_id:
        x-relationship: {}
      comment_id:
        x-relationship:
          labelField: id
  attachable:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    properties:
      attachments:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/attachment"

  attachment:
    fields:
      type:
        minimum: 0
        maximum: 3
        enum:
          - image
          - file
          - video
          - audio
        _required: true
      order:
        default: 0
      name: {}
      path:
        format: uri
      attachable_id: {}
  dashboard_widget:
    fields:
      dashboard_id:
        x-relationship: {}
      name: {}
      entity_name: {}
      chart_type:
        minimum: 0
        maximum: 3
        enum:
          - pie
          - column
          - bar
          - line
        default: 1
      stack_mode:
        minimum: 0
        maximum: 2
        enum:
          - grouped
          - stacked
          - standardized
      series_field: {}
      group_by_bucket:
        minimum: 0
        maximum: 4
        enum:
          - day
          - week
          - month
          - quarter
          - year
      group_by_field: {}
      filter_field: {}
      filter_value: {}
      order:
        default: 0
  dashboard:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
      search: true
    x-search:
      text_fields: [name]
      snippet_field: name
      bigm_fields: [name]
    x-custom-components:
      - name: DashboardView
        path: "@/components/_standard/DashboardView"
        target:
          - view
    x-display:
      table:
        - name:
            primary: true
            width: 200
    fields:
      name: {}
    required:
