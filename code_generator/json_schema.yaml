$schema: "http://json-schema.org/draft-07/schema#"

# Support multi-tenancy
format-version: 2.0

# Generator configuration (DP-3: search opt-in vs all-entity default)
# search.default_scope: 'opt_in' — only entities with x-generate.search: true are searchable
# search.default_scope: 'all'    — all entities are searchable; exclude with x-generate.search: false
x-generator:
  search:
    default_scope: all

x-receiving:
  roles:
    purchase_order: receiving_purchase_order
    asn: receiving_asn
    receipt: receiving_receipt
  policy:
    allowDirectReceipt: true
    allowReceiptFromAsn: true
    allowReceiptFromPurchaseOrder: true
    inventoryMutation: confirm_receipt
  inventory:
    entity: inventory
    productField: product_id
    quantityField: quantity
  lines:
    productField: product_id
    quantityField: receipt_quantity

definitions:
  # ============================================================
  # System entities (required by all apps — see §1.1)
  # Keep these definitions intact when creating a new app.
  # ============================================================

  user:
    type: object
    required:
      - id
      - name
      - email
    x-display:
      table:
        - name:
            primary: true
            width: 150
        - additional_info:
            width: 250
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      email:
        type: string
      # Nullable so SSO-provisioned users (Google, etc.) can exist without a
      # bcrypt hash. Credentials sign-in still requires a non-null password —
      # auth.ts authorize() rejects accounts with password === null.
      password:
        type:
          - string
          - "null"
        x-custom-component:
          target:
            - upsert
      api_key:
        type:
          - string
          - "null"
        x-custom-component:
          target:
            - upsert
      image:
        type:
          - string
          - "null"
        format: uri
      mfa_enabled:
        type: boolean
        default: false
        x-custom-component:
          target:
            - upsert

  role:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type:
          - string
          - "null"

  user_detail:
    x-generate:
      list: true
      view: true
      new: false
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
      fields:
        - name
        - image
        - roles
    x-custom-components:
      - name: MfaToggle
        path: "@/components/_standard/MfaToggle"
        target:
          - view
    x-relationships:
      roles:
        type: many-to-many
        target: role
    allOf:
      - $ref: "#/definitions/user"
      - type: object
        required:
          - roles
        properties:
          roles:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/role"

  setting:
    x-generate:
      list: false
      view: true
      new: false
      edit: true
      delete: false
      invalidate: false
      api: true
      fields:
        - name
        - email
        - image
        - password
        - api_key
        - mfa_enabled
    x-relationships:
      roles:
        type: many-to-many
        target: role
    allOf:
      - $ref: "#/definitions/user"
      - type: object
        required:
          - roles
        properties:
          roles:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/role"

  role_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
      search: true
    # Security-sensitive entity: every create/update/delete is recorded in
    # the audit_log table by the generated service layer.
    x-audit: true
    x-relationships:
      users:
        type: many-to-many
        target: user
    allOf:
      - $ref: "#/definitions/role"
      - type: object
        required:
          - users
        properties:
          users:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/user"

  organization:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type:
          - string
          - "null"

  organization_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    x-search:
      org_id_field: id
    x-relationships:
      users:
        type: many-to-many
        target: user
    allOf:
      - $ref: "#/definitions/organization"
      - type: object
        required:
          - users
        properties:
          users:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/user"

  permission:
    type: object
    required:
      - id
      - name
      - create
      - read
      - update
      - delete
    x-display:
      table:
        - name:
            width: 200
        - role:
            width: 200
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
        x-entity-select: true
      create:
        type: boolean
      read:
        type: boolean
      update:
        type: boolean
      delete:
        type: boolean
      role_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: role
          labelField: name

  permission_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    # Security-sensitive entity: every create/update/delete is recorded in
    # the audit_log table by the generated service layer.
    x-audit: true
    allOf:
      - $ref: "#/definitions/permission"
      - type: object
        properties:
          role:
            $ref: "#/definitions/role"

  approval_flow:
    type: object
    required:
      - id
      - entity_name
      - approver_role_id
    x-display:
      table:
        - entity_name:
            primary: true
            width: 200
        - requestor_role:
            width: 150
        - approver_role:
            width: 150
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      entity_name:
        type: string
        minLength: 1
        x-entity-select: true
      requestor_role_id:
        type: 
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: role
          labelField: name
      approver_role_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: role
          labelField: name

  approval_flow_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    x-relationships:
      preceded_by:
        type: many-to-many
        target: approval_flow
        labelField: entity_name
        secondaryLabelField: approver_role.name
      followed_by:
        type: many-to-many
        target: approval_flow
        labelField: entity_name
        secondaryLabelField: approver_role.name
    allOf:
      - $ref: "#/definitions/approval_flow"
      - type: object
        required:
          - approver_role
          - preceding_transitions
        properties:
          requestor_role:
            $ref: "#/definitions/role"
          approver_role:
            $ref: "#/definitions/role"
          preceded_by:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/approval_flow"
          followed_by:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/approval_flow"

  approval_request:
    type: object
    required:
      - id
      - approvable_id
      - approval_flow_id
    x-display:
      table:
        - approval_flow:
            width: 200
        - status:
            width: 100
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      approvable_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: approvable
          labelField: id
      approval_flow_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: approval_flow
          labelField: entity_name
      status:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - Pending
          - Approved
          - Rejected
          - TerminalRejected

  approvable:
    type: object
    required:
      - id
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      rejection_reason:
        type:
          - string
          - "null"

  approvable_detail:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    allOf:
      - $ref: "#/definitions/approvable"
      - type: object
        required:
          - approval_requests
        properties:
          approval_requests:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/approval_request"

  commentable:
    type: object
    required:
