$schema: "http://json-schema.org/draft-07/schema#"
format-version: 3.0

x-generator:
  mobile:
    enabled: true

# Fixture design note: entities without relations, which is the set that gets
# native list / detail / form screens in the Expo app (mobile_entities.py).
#  - mobile_note: full CRUD, one field of every kind the native form draws.
#  - mobile_log: read-only (list and view only), to prove the screens follow the
#    entity's own x-generate flags.
#  - mobile_group / mobile_tag / mobile_profile: plain targets for the relation pickers.
#  - mobile_task: a required many-to-one foreign key (mobile_group_id), a many-to-many
#    (tags, x-outputType: list) and a one-to-one selector (mobile_profile_id) -- the relation kinds the
#    native pickers draw.
#  - mobile_thread: a commentable entity (a one-to-one bridge to commentable) whose detail screen
#    draws the comment thread, the comment box and the reaction bar (it can be edited, so the comment write
#    routes exist). commentable / comment / reaction /
#    attachment are hand-copied from tests/fixtures/mention_gate (without x-mention) because a
#    fixture does not pick up the repository's internal entities.
#  - mobile_asset: an entity that owns attachments through the `attachable` bridge (a one-to-one bridge to
#    attachable plus the AttachmentSection view / edit component): the detail screen lists the attachments and the
#    edit form saves them through PUT /api/mobile_asset/{id}/attachments.
# Used by tests/test_mobile_entities.py (generation + shape) and by the Expo
# Playwright run described in docs/knowledge/mobile-app.md.

definitions:
  user:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    properties:
      name: {}
      email: {}
      image_id:
        x-relationship:
          target: attachment
          type: direct

  mobile_note:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
        - status: {}
        - priority: {}
    properties:
      title:
        x-trigram-filter: true
      details: {}
      status:
        enum: ["open", "closed"]
      priority: {}
      amount: {}
      is_done: {}
      due_on:
        format: date
    required:
      - title
      - status
      - is_done

  # Hand-written components: entity level (list, view, edit; one on both view and edit) and field level
  # (`secret` upsert only, `badge` view only, `mood` both).
  mobile_widget:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
        - badge: {}
    x-custom-components:
      - name: WidgetToolbar
        target:
          - list
      - name: WidgetSummary
        target:
          - view
        props:
          compact: true
      - name: WidgetHelper
        target:
          - view
          - edit
      - name: WidgetEditNote
        target:
          - edit
    properties:
      title: {}
      secret:
        x-custom-component:
          target:
            - upsert
      badge:
        x-custom-component:
          target:
            - view
      mood:
        x-custom-component:
          target:
            - upsert
            - view
    required:
      - title

  mobile_log:
    x-generate:
      list: true
      view: true
      new: false
      edit: false
      delete: false
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - message:
            primary: true
    properties:
      message: {}
    required:
      - message

  mobile_group:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    properties:
      name: {}
    required:
      - name

  mobile_tag:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    properties:
      name: {}
    required:
      - name

  mobile_profile:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    properties:
      name: {}
    required:
      - name

  mobile_task:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
        - mobile_group: {}
    x-relationships:
      tags:
        type: many-to-many
        target: mobile_tag
        labelField: name
    properties:
      title: {}
      mobile_group_id:
        x-relationship:
          labelField: name
      mobile_profile_id:
        x-relationship:
          type: one-to-one
          target: mobile_profile
          labelField: name
      mobile_label_id:
        x-relationship:
          labelField: name
        # The picker forwards the group chosen in the same form to the target's autocomplete filter.
        x-autocomplete-context: [mobile_group_id]
      mobile_profile:
        $ref: "#/definitions/mobile_profile"
      tags:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/mobile_tag"
    required:
      - title
      - mobile_group_id

  # x-create-inline: mobile_ticket's category field offers "Create new", which opens
  # mobile_category's native create form over the ticket form. mobile_category declares no
  # x-create-inline itself (nesting depth is 1).
  # A self-referencing one-to-many list (`children`) over the nullable `parent_id`: the picker offers records
  # that have no parent yet or are already this record's children, and never the record itself.
  mobile_step:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    properties:
      name: {}
      parent_id:
        x-relationship: {}
      parent:
        $ref: "#/definitions/mobile_step"
      children:
        type: array
        items:
          $ref: "#/definitions/mobile_step"
        x-outputType: list
    required:
      - name
      - children

  mobile_category:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    properties:
      name: {}
    required:
      - name

  # x-entity-select: entity_name holds the name of one of the schema's entities; the native form draws
  # it as chips labelled with the entity titles and saves the entity name.
  mobile_rule:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
        - entity_name: {}
    properties:
      name: {}
      entity_name:
        x-entity-select: true
    required:
      - name
      - entity_name

  mobile_ticket:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
    properties:
      title: {}
      mobile_category_id:
        x-relationship:
          type: many-to-one
          target: mobile_category
          labelField: name
        x-create-inline: true
    required:
      - title
      - mobile_category_id

  # Direct attachment fields (x-relationship type: direct): the form uploads a file, creates the
  # attachment row and submits its id. `file` may stay empty, `contract` is required.
  mobile_document:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
    properties:
      title: {}
      file_id:
        x-relationship:
          target: attachment
          type: direct
      contract_id:
        x-relationship:
          target: attachment
          type: direct
    required:
      - title
      - contract_id

  # x-payment: creating a record answers with a hosted checkout URL, which the native form opens
  # in the in-app browser. The Price is the entity's own stripe_price_id (a column default).
  mobile_order:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-payment: true
    x-display:
      table:
        - name:
            primary: true
    properties:
      name: {}
      stripe_price_id: {}
    required:
      - name

  # A one-to-many child collection (the Web form's editable grid): drawn on mobile as a row editor.
  # The line carries a required integer, an enum with a default, an optional date, a decimal-free text and a
  # required foreign key to mobile_group, so the row editor draws a text, number, enum, date and picker control.
  mobile_invoice:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - invoice_no:
            primary: true
    properties:
      invoice_no: {}
      lines:
        type: array
        items:
          $ref: "#/definitions/mobile_invoice_line"
    required:
      - invoice_no

  mobile_invoice_line:
    properties:
      description: {}
      quantity:
        minimum: 1
      line_status:
        enum: ["open", "billed"]
        default: open
      shipped_on:
        format: date
      mobile_group_id:
        x-relationship:
          labelField: name
    required:
      - description
      - quantity
      - mobile_group_id

  attachment:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    properties:
      type:
        enum:
          - image
          - file
          - video
          - audio
      path:
        format: uri
  attachable:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    required:
      - attachments
    properties:
      attachments:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/attachment"
  commentable:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    required:
      - comments
    properties:
      comments:
        type: array
        x-outputType: comments
        items:
          $ref: "#/definitions/comment"
  comment:
    properties:
      message: {}
      commentable_id: {}
  reaction:
    x-internal:
      page: false
      embed: false
      api: custom
    properties:
      type:
        enum:
          - like
          - love
          - laugh
          - surprised
          - sad
      user_id:
        x-relationship: {}
      comment_id:
        x-relationship:
          labelField: id
          constantParent: true

  mobile_asset:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: false
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
    x-custom-components:
      - name: AttachmentSection
        path: "@/components/_standard/AttachmentSection"
        target:
          - view
          - edit
    properties:
      title: {}
      attachable_id:
        x-relationship:
          type: one-to-one_bridge
          target: attachable
          labelField: id
      attachable:
        $ref: "#/definitions/attachable"
    required:
      - title

  mobile_thread:
    x-generate:
      list: true
      view: true
      new: false
      edit: true
      delete: false
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
    properties:
      title: {}
      commentable_id:
        x-relationship:
          type: one-to-one_bridge
          target: commentable
          labelField: id
      commentable:
        $ref: "#/definitions/commentable"
    required:
      - title
