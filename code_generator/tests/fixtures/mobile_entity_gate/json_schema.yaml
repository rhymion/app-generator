$schema: "http://json-schema.org/draft-07/schema#"
format-version: 3.0

x-generator:
  mobile:
    enabled: true

# Fixture design note: entities without relations, which is the set that gets
# native list / detail / form screens in the Expo app (mobile_entities.py).
#  - mobile_note: full CRUD, one field of every kind the native form draws.
#  - mobile_log: read-only (list and view only), to prove the screens follow the
#    entity's own x-generate flags.
#  - mobile_group / mobile_tag / mobile_profile: plain targets for the relation pickers.
#  - mobile_task: a required many-to-one foreign key (mobile_group_id), a many-to-many
#    (tags, x-outputType: list) and a one-to-one selector (mobile_profile_id) -- the relation kinds the
#    native pickers draw.
#  - mobile_thread: a commentable entity (a one-to-one bridge to commentable) whose detail screen
#    draws the comment thread, the comment box and the reaction bar (it can be edited, so the comment write
#    routes exist). commentable / comment / reaction /
#    attachment are hand-copied from tests/fixtures/mention_gate (without x-mention) because a
#    fixture does not pick up the repository's internal entities.
# Used by tests/test_mobile_entities.py (generation + shape) and by the Expo
# Playwright run described in docs/knowledge/mobile-app.md.

definitions:
  user:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    fields:
      name: {}
      email: {}
      image_id:
        x-relationship:
          target: attachment
          type: direct

  mobile_note:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
        - status: {}
        - priority: {}
    fields:
      title: {}
      details: {}
      status:
        enum: ["open", "closed"]
      priority: {}
      amount: {}
      is_done: {}
      due_on:
        format: date
    required:
      - title
      - status
      - is_done

  mobile_log:
    x-generate:
      list: true
      view: true
      new: false
      edit: false
      delete: false
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - message:
            primary: true
    fields:
      message: {}
    required:
      - message

  mobile_group:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    fields:
      name: {}
    required:
      - name

  mobile_tag:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    fields:
      name: {}
    required:
      - name

  mobile_profile:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    fields:
      name: {}
    required:
      - name

  mobile_task:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
        - mobile_group_id: {}
    x-relationships:
      tags:
        type: many-to-many
        target: mobile_tag
        labelField: name
    fields:
      title: {}
      mobile_group_id:
        x-relationship:
          labelField: name
      mobile_profile_id:
        x-relationship:
          type: one-to-one
          target: mobile_profile
          labelField: name
      mobile_label_id:
        x-relationship:
          labelField: name
        # The picker forwards the group chosen in the same form to the target's autocomplete filter.
        x-autocomplete-context: [mobile_group_id]
    properties:
      mobile_profile:
        $ref: "#/definitions/mobile_profile"
      tags:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/mobile_tag"
    required:
      - title
      - mobile_group_id

  # x-create-inline: mobile_ticket's category field offers "Create new", which opens
  # mobile_category's native create form over the ticket form. mobile_category declares no
  # x-create-inline itself (nesting depth is 1).
  mobile_category:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    fields:
      name: {}
    required:
      - name

  mobile_ticket:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
    fields:
      title: {}
      mobile_category_id:
        x-relationship:
          type: many-to-one
          target: mobile_category
          labelField: name
        x-create-inline: true
    required:
      - title
      - mobile_category_id

  # x-payment: creating a record answers with a hosted checkout URL, which the native form opens
  # in the in-app browser. The Price is the entity's own stripe_price_id (a column default).
  mobile_order:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-payment: true
    x-display:
      table:
        - name:
            primary: true
    fields:
      name: {}
      stripe_price_id: {}
    required:
      - name

  attachment:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    fields:
      path:
        format: uri
  commentable:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    required:
      - comments
    properties:
      comments:
        type: array
        x-outputType: comments
        items:
          $ref: "#/definitions/comment"
  comment:
    fields:
      message: {}
      commentable_id: {}
  reaction:
    x-internal:
      page: false
      embed: false
      api: custom
    fields:
      type:
        enum:
          - like
          - love
          - laugh
          - surprised
          - sad
      user_id:
        x-relationship: {}
      comment_id:
        x-relationship:
          labelField: id
          constantParent: true

  mobile_thread:
    x-generate:
      list: true
      view: true
      new: false
      edit: true
      delete: false
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
    fields:
      title: {}
      commentable_id:
        x-relationship:
          type: one-to-one_bridge
          target: commentable
          labelField: id
    properties:
      commentable:
        $ref: "#/definitions/commentable"
    required:
      - title
