$schema: "http://json-schema.org/draft-07/schema#"
format-version: 3.0

# Fixture design note (cmd_755[1]): a NEW fixture, not an extension of
# decimal_gate or oto_decimal_gate. decimal_gate (code_generator/tests/
# fixtures/decimal_gate/) exercises an entity's OWN Decimal columns via
# getters.ts's decimal_display_columns .toString() override, and a Decimal
# reached through an embedded many-to-one/one-to-many relation via
# relationship_mapping's deepStringifyDecimals wrap. oto_decimal_gate
# (code_generator/tests/fixtures/oto_decimal_gate/) exercises a one-to-one
# selector's separate getAvailable{Target}sFor{Parent} getter. Neither
# compiles the branch this fixture exists for: get{Parent}sForChart
# (chart_getters.ts.jinja2), generated only when x-display.chart is
# declared, assigns a required Decimal column straight off the raw Prisma
# row (`{{ field }}: item.{{ field }},`) into a field the generated
# {Parent}ForChart interface types as `string` (chart_context() in
# generators.py resolves the JSON-schema type, and a Decimal column's
# resolved type is `string` per cmd_705 -- but the raw row value is a
# Prisma.Decimal instance, not a string) -- a TS2322 at build time. This
# repo's own json_schema.yaml has no entity combining x-display.chart with
# a required Decimal column, so test:e2e:build never compiles this branch.

definitions:
  user:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    fields:
      name: {}
      email: {}

  # The chart's row_by target -- no pages of its own needed; only exists to
  # be picked via chart_decimal_gate_item's many-to-one FK.
  chart_decimal_gate_row:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    fields:
      name: {}

  # The entity this fixture exists to exercise: x-display.chart declared,
  # with a REQUIRED Decimal column (amount) so
  # `getChartDecimalGateItemsForChart` (chart_getters.ts.jinja2) must
  # serialize it before assigning into the generated (Decimal-as-string)
  # ChartDecimalGateItemForChart interface. `view: true` is the only
  # core x-generate flag left on -- extract_entities() (generate_types.py)
  # skips any entity whose list/view/new/edit/delete/api flags are ALL
  # explicitly False (treated as a pure internal model), which would drop
  # this entity -- and with it the chart pages -- from generation entirely.
  chart_decimal_gate_item:
    x-generate:
      list: false
      view: true
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    x-display:
      chart:
        span: week
        row_by: chart_decimal_gate_row
    fields:
      name: {}
      chart_decimal_gate_row_id:
        x-relationship:
          target: chart_decimal_gate_row
          labelField: name
      start_time:
        format: date-time
      end_time:
        format: date-time
      amount: {}
    required:
      - amount
