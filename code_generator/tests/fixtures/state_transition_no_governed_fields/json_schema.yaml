$schema: "http://json-schema.org/draft-07/schema#"
format-version: 3.0

# cmd_1139: proves lib/state_transitions.ts is skipped entirely (not
# emitted, even empty) when a schema declares no x-state-machines entries
# at all -- opt-in byte identity for a schema untouched by the feature.
# Deliberately carries no x-state-machines key and no enum field that
# could be mistaken for a governed one.

definitions:
  user:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    fields:
      name: {}
      email: {}

  plain_widget:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: false
      invalidate: false
      api: true
      test: false
    fields:
      code: {}
      label: {}
