$schema: "http://json-schema.org/draft-07/schema#"
format-version: 3.0

x-generator:
  mobile:
    enabled: true

# Fixture design note: entities without relations, which is the set that gets
# native list / detail / form screens in the Expo app (mobile_entities.py).
#  - mobile_note: full CRUD, one field of every kind the native form draws.
#  - mobile_log: read-only (list and view only), to prove the screens follow the
#    entity's own x-generate flags.
#  - mobile_group / mobile_tag / mobile_profile / mobile_task: the relation pickers (a required
#    many-to-one foreign key, a many-to-many and a one-to-one selector).
#  - mobile_org_item: a foreign key to organization, which scopes the entity by organization
#    membership, so the picker must offer only the caller's organizations.
#  - mobile_thread: a commentable entity (list, view, edit and delete): its detail screen draws the comment
#    thread with the comment box, the @-mention lookup and the reaction bar. The default schema supplies commentable / comment / reaction.
# Used by the Expo Playwright run described in docs/knowledge/mobile-app.md.

definitions:
  mobile_note:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
        - status: {}
        - priority: {}
    fields:
      title: {}
      details: {}
      status:
        enum: ["open", "closed"]
      priority: {}
      amount: {}
      is_done: {}
      due_on:
        format: date
    required:
      - title
      - status
      - is_done

  mobile_log:
    x-generate:
      list: true
      view: true
      new: false
      edit: false
      delete: false
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - message:
            primary: true
    fields:
      message: {}
    required:
      - message

  mobile_group:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    fields:
      name: {}
    required:
      - name

  mobile_tag:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    fields:
      name: {}
    required:
      - name

  mobile_profile:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    fields:
      name: {}
    required:
      - name

  mobile_task:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
        - mobile_group_id: {}
    x-relationships:
      tags:
        type: many-to-many
        target: mobile_tag
        labelField: name
    fields:
      title: {}
      mobile_group_id:
        x-relationship:
          labelField: name
      mobile_profile_id:
        x-relationship:
          type: one-to-one
          target: mobile_profile
          labelField: name
      mobile_label_id:
        x-relationship:
          labelField: name
        # The picker forwards the group chosen in the same form to the target's autocomplete filter.
        x-autocomplete-context: [mobile_group_id]
    properties:
      mobile_profile:
        $ref: "#/definitions/mobile_profile"
      tags:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/mobile_tag"
    required:
      - title
      - mobile_group_id

  mobile_org_item:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    fields:
      name: {}
      organization_id:
        x-relationship:
          labelField: name
    required:
      - name
      - organization_id

  # x-create-inline: mobile_ticket's category field offers "Create new", which opens
  # mobile_category's native create form over the ticket form. mobile_category declares no
  # x-create-inline itself (nesting depth is 1).
  mobile_category:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    fields:
      name: {}
    required:
      - name

  mobile_ticket:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
    fields:
      title: {}
      mobile_category_id:
        x-relationship:
          type: many-to-one
          target: mobile_category
          labelField: name
        x-create-inline: true
    required:
      - title
      - mobile_category_id

  # x-payment: creating a record answers with a hosted checkout URL, which the native form opens
  # in the in-app browser. The Price is the entity's own stripe_price_id (a column default).
  mobile_order:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-payment: true
    x-display:
      table:
        - name:
            primary: true
    fields:
      name: {}
      stripe_price_id: {}
    required:
      - name

  mobile_thread:
    x-generate:
      list: true
      view: true
      new: false
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
    fields:
      title: {}
      commentable_id:
        x-relationship:
          type: one-to-one_bridge
          target: commentable
          labelField: id
    properties:
      commentable:
        $ref: "#/definitions/commentable"
    required:
      - title

  # Approval: the detail screen shows the approval requests of the current round with approve / reject / withdraw.
  mobile_request:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: false
      invalidate: false
      api: true
      test: false
    x-approval:
      submit_on:
        status: submitted
      on_approved:
        set_fields:
          status: approved
      on_rejected:
        set_fields:
          status: rejected
      on_withdrawn:
        set_fields:
          status: draft
    x-display:
      table:
        - title:
            primary: true
        - status: {}
    x-custom-components:
      - name: ApprovalSection
        path: "@/components/_standard/ApprovalSection"
        target:
          - view
    fields:
      title: {}
      status:
        enum: ["draft", "submitted", "approved", "rejected"]
      approvable_id:
        x-relationship:
          type: one-to-one_bridge
          target: approvable
          labelField: id
    properties:
      approvable:
        $ref: "#/definitions/approvable"
    required:
      - title
      - status
      - approvable_id

  # Split: the detail screen of an approval entity with x-splittable offers the split action. The
  # parts redistribute the quantity and each names a group.
  mobile_shipment:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: false
      invalidate: false
      api: true
      test: false
    x-approval:
      submit_on:
        status: pending
      on_approved:
        set_fields:
          status: approved
      on_rejected:
        set_fields:
          status: rejected
      on_withdrawn:
        set_fields:
          status: draft
    x-splittable:
      quantityField: quantity
      perPartRequired:
        - mobile_group_id
    x-display:
      table:
        - title:
            primary: true
        - quantity: {}
        - status: {}
    x-custom-components:
      - name: ApprovalSection
        path: "@/components/_standard/ApprovalSection"
        target:
          - view
    fields:
      title: {}
      quantity: {}
      status:
        enum: ["draft", "pending", "approved", "rejected", "split"]
      mobile_group_id:
        x-relationship:
          labelField: name
      approvable_id:
        x-relationship:
          type: one-to-one_bridge
          target: approvable
          labelField: id
    properties:
      approvable:
        $ref: "#/definitions/approvable"
    required:
      - title
      - quantity
      - status
      - mobile_group_id
      - approvable_id
