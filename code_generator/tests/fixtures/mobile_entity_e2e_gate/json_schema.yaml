$schema: "http://json-schema.org/draft-07/schema#"
format-version: 3.0

# Fixture design note: entities without relations, which is the set that gets
# native list / detail / form screens in the Expo app (mobile_entities.py).
#  - mobile_note: full CRUD, one field of every kind the native form draws.
#  - mobile_log: read-only (list and view only), to prove the screens follow the
#    entity's own x-generate flags.
#  - mobile_group / mobile_tag / mobile_profile / mobile_task: the relation pickers (a required
#    many-to-one foreign key, a many-to-many and a one-to-one selector).
#  - mobile_org_item: a foreign key to organization, which scopes the entity by organization
#    membership, so the picker must offer only the caller's organizations.
# Used by the Expo Playwright run described in docs/knowledge/mobile-app.md.

definitions:
  mobile_note:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
        - status: {}
        - priority: {}
    fields:
      title: {}
      details: {}
      status:
        enum: ["open", "closed"]
      priority: {}
      amount: {}
      is_done: {}
      due_on:
        format: date
    required:
      - title
      - status
      - is_done

  mobile_log:
    x-generate:
      list: true
      view: true
      new: false
      edit: false
      delete: false
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - message:
            primary: true
    fields:
      message: {}
    required:
      - message

  mobile_group:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    fields:
      name: {}
    required:
      - name

  mobile_tag:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    fields:
      name: {}
    required:
      - name

  mobile_profile:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    fields:
      name: {}
    required:
      - name

  mobile_task:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
        - mobile_group_id: {}
    x-relationships:
      tags:
        type: many-to-many
        target: mobile_tag
        labelField: name
    fields:
      title: {}
      mobile_group_id:
        x-relationship:
          labelField: name
      mobile_profile_id:
        x-relationship:
          type: one-to-one
          target: mobile_profile
          labelField: name
      mobile_label_id:
        x-relationship:
          labelField: name
        # The picker forwards the group chosen in the same form to the target's autocomplete filter.
        x-autocomplete-context: [mobile_group_id]
    properties:
      mobile_profile:
        $ref: "#/definitions/mobile_profile"
      tags:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/mobile_tag"
    required:
      - title
      - mobile_group_id

  mobile_org_item:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    fields:
      name: {}
      organization_id:
        x-relationship:
          labelField: name
    required:
      - name
      - organization_id
