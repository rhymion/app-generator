$schema: "http://json-schema.org/draft-07/schema#"
format-version: 3.0

x-generator:
  mobile:
    enabled: true

# Fixture design note: entities without relations, which is the set that gets
# native list / detail / form screens in the Expo app (mobile_entities.py).
#  - mobile_note: full CRUD, one field of every kind the native form draws, including two URL columns
#    (`x-uri-kind` image and file) that take a pasted URL.
#  - mobile_log: read-only (list and view only), to prove the screens follow the
#    entity's own x-generate flags.
#  - mobile_group / mobile_tag / mobile_profile / mobile_task: the relation pickers (a required
#    many-to-one foreign key, a many-to-many and a one-to-one selector).
#  - mobile_step: a self-referencing one-to-many list (`children`) over a nullable `parent_id`.
#  - mobile_org_item: a foreign key to organization, which scopes the entity by organization
#    membership, so the picker must offer only the caller's organizations.
#  - mobile_thread: a commentable entity (list, view, edit and delete): its detail screen draws the comment
#    thread with the comment box, the @-mention lookup and the reaction bar. The default schema supplies commentable / comment / reaction.
#  - mobile_invoice: a one-to-many child collection (`lines`, each with text, number, enum, date and a required
#    foreign key to mobile_group): the form draws a row editor and sends the rows as the property array.
#  - mobile_document: two direct attachment fields (x-relationship type: direct), `file` optional and
#    `contract` required: the form picks a file, uploads it, and submits the created attachment row's id.
#  - mobile_gadget: hand-written native components (x-custom-components on list / view / edit and x-custom-component on
#    two fields). Most of them are overridden by the files in mobile_stubs/, copied in before generation (the stubs are
#    write-once, so the generator keeps them); the rest keep the generated stub, which draws nothing.
#  - mobile_asset: an entity that owns attachments through the `attachable` bridge (one-to-one_bridge to
#    `attachable` plus the AttachmentSection view / edit component): the detail screen lists the attachments and
#    the edit form adds, removes and reorders them (images and files).
# Used by the Expo Playwright run described in docs/knowledge/mobile-app.md.

definitions:
  mobile_note:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
        - status: {}
        - priority: {}
    properties:
      title:
        x-trigram-filter: true
      details: {}
      status:
        enum: ["open", "closed"]
      priority: {}
      amount: {}
      is_done: {}
      due_on:
        format: date
      remind_at:
        format: date-time
      remind_time:
        format: time
      # URL columns: the mobile form draws a plain URL input for each (no upload path).
      photo_url:
        format: uri
      datasheet_url:
        format: uri
        x-uri-kind: file

  mobile_log:
    x-generate:
      list: true
      view: true
      new: false
      edit: false
      delete: false
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - message:
            primary: true
    properties:
      message: {}

  # x-entity-select: entity_name holds the name of one of the schema's entities; the native form draws
  # it as chips labelled with the entity titles and saves the entity name.
  mobile_rule:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
        - entity_name: {}
    properties:
      name: {}
      entity_name:
        x-entity-select: true

  mobile_group:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    properties:
      name: {}

  mobile_tag:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    properties:
      name: {}

  mobile_profile:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    properties:
      name: {}

  mobile_task:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
        - mobile_group: {}
    x-relationships:
      tags:
        type: many-to-many
        target: mobile_tag
        labelField: name
    properties:
      title:
        x-trigram-filter: true
      mobile_group_id:
        x-relationship:
          labelField: name
      mobile_profile_id:
        x-relationship:
          type: one-to-one
          target: mobile_profile
          labelField: name
      mobile_label_id:
        x-relationship:
          labelField: name
        # The picker forwards the group chosen in the same form to the target's autocomplete filter.
        x-autocomplete-context: [mobile_group_id]
      mobile_profile:
        $ref: "#/definitions/mobile_profile"
      tags:
        type: array
        x-outputType: list
        items:
          $ref: "#/definitions/mobile_tag"

  mobile_org_item:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    properties:
      name: {}
      organization_id:
        x-relationship:
          labelField: name

  mobile_document:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
    properties:
      title: {}
      file_id:
        x-relationship:
          target: attachment
          type: direct
      contract_id:
        x-relationship:
          target: attachment
          type: direct

  # x-create-inline: mobile_ticket's category field offers "Create new", which opens
  # mobile_category's native create form over the ticket form. mobile_category declares no
  # x-create-inline itself (nesting depth is 1).
  mobile_category:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    properties:
      name: {}

  mobile_ticket:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
    properties:
      title: {}
      mobile_category_id:
        x-relationship:
          type: many-to-one
          target: mobile_category
          labelField: name
        x-create-inline: true

  # x-payment: creating a record answers with a hosted checkout URL, which the native form opens
  # in the in-app browser. The Price is the entity's own stripe_price_id (a column default).
  mobile_order:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-payment: true
    x-display:
      table:
        - name:
            primary: true
    properties:
      name: {}
      stripe_price_id: {}

  mobile_thread:
    x-generate:
      list: true
      view: true
      new: false
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
    properties:
      title: {}
      commentable_id:
        x-relationship:
          type: one-to-one_bridge
          target: commentable
          labelField: id
      commentable:
        $ref: "#/definitions/commentable"

  # Approval: the detail screen shows the approval requests of the current round with approve / reject / withdraw.
  mobile_request:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: false
      invalidate: false
      api: true
      test: false
    x-approval:
      submit_on:
        status: submitted
      on_approved:
        set_fields:
          status: approved
      on_rejected:
        set_fields:
          status: rejected
      on_withdrawn:
        set_fields:
          status: draft
    x-display:
      table:
        - title:
            primary: true
        - status: {}
    x-custom-components:
      - name: ApprovalSection
        path: "@/components/_standard/ApprovalSection"
        target:
          - view
    properties:
      title: {}
      status:
        enum: ["draft", "submitted", "approved", "rejected"]
        _required: true
      approvable_id:
        x-relationship:
          type: one-to-one_bridge
          target: approvable
          labelField: id
      approvable:
        $ref: "#/definitions/approvable"

  # Split: the detail screen of an approval entity with x-splittable offers the split action. The
  # parts redistribute the quantity and each names a group.
  mobile_shipment:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: false
      invalidate: false
      api: true
      test: false
    x-approval:
      submit_on:
        status: pending
      on_approved:
        set_fields:
          status: approved
      on_rejected:
        set_fields:
          status: rejected
      on_withdrawn:
        set_fields:
          status: draft
    x-splittable:
      quantityField: quantity
      perPartRequired:
        - mobile_group_id
    x-display:
      table:
        - title:
            primary: true
        - quantity: {}
        - status: {}
    x-custom-components:
      - name: ApprovalSection
        path: "@/components/_standard/ApprovalSection"
        target:
          - view
    properties:
      title: {}
      quantity: {}
      status:
        enum: ["draft", "pending", "approved", "rejected", "split"]
        _required: true
      mobile_group_id:
        x-relationship:
          labelField: name
      approvable_id:
        x-relationship:
          type: one-to-one_bridge
          target: approvable
          labelField: id
      approvable:
        $ref: "#/definitions/approvable"

  # Reservation: the server allocates a room from the pool when a stay is created. A request with no free
  # room is refused with CAPACITY, and an allocated stay can no longer change its criteria
  # (RESERVATION_LOCKED); the form never asks for the allocated room.
  mobile_room:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - room_no:
            primary: true
        - category: {}
    properties:
      room_no: {}
      category: {}
      room_state:
        type: integer

  mobile_stay:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-reservation:
      mode: item
      pool:
        entity: mobile_room
        statusField: room_state
        availableStatus: 0
        reservedStatus: 2
      request:
        criteria:
          category: category
      result:
        allocatedField: mobile_room_id
    x-display:
      table:
        - guest_name:
            primary: true
        - category: {}
    properties:
      guest_name: {}
      category: {}
      mobile_room_id:
        x-relationship:
          labelField: room_no

  # A one-to-many child collection (the Web form's editable grid): drawn on mobile as a row editor.
  # The line carries a required integer, an enum with a default, an optional date, a decimal-free text and a
  # required foreign key to mobile_group, so the row editor draws a text, number, enum, date and picker control.
  mobile_invoice:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - invoice_no:
            primary: true
    properties:
      invoice_no: {}
      lines:
        type: array
        items:
          $ref: "#/definitions/mobile_invoice_line"

  mobile_invoice_line:
    properties:
      description: {}
      quantity:
        minimum: 1
      line_status:
        enum: ["open", "billed"]
        default: open
      shipped_on:
        format: date
      mobile_group_id:
        x-relationship:
          labelField: name

  # A self-referencing one-to-many list (`children`) over the nullable `parent_id`: the picker offers records
  # that have no parent yet or are already this record's children, and never the record itself.
  mobile_step:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    properties:
      name: {}
      parent_id:
        x-relationship: {}
      parent:
        $ref: "#/definitions/mobile_step"
      children:
        type: array
        items:
          $ref: "#/definitions/mobile_step"
        x-outputType: list
    required:
      - children

  mobile_asset:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
    x-custom-components:
      - name: AttachmentSection
        path: "@/components/_standard/AttachmentSection"
        target:
          - view
          - edit
    properties:
      title: {}
      attachable_id:
        x-relationship:
          type: one-to-one_bridge
          target: attachable
          labelField: id
      attachable:
        $ref: "#/definitions/attachable"

  mobile_gadget:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
        - code: {}
    x-custom-components:
      - name: GadgetToolbar
        target:
          - list
      - name: GadgetSummary
        target:
          - view
        props:
          tone: info
      - name: GadgetBanner
        target:
          - edit
      - name: GadgetNote
        target:
          - edit
    properties:
      title: {}
      code:
        x-custom-component:
          target:
            - upsert
            - view
      pin:
        x-custom-component:
          target:
            - upsert
