$schema: "http://json-schema.org/draft-07/schema#"
format-version: 3.0

# Fixture design note: entities without relations, which is the set that gets
# native list / detail / form screens in the Expo app (mobile_entities.py).
#  - mobile_note: full CRUD, one field of every kind the native form draws.
#  - mobile_log: read-only (list and view only), to prove the screens follow the
#    entity's own x-generate flags.
# Used by tests/test_mobile_entities.py (generation + shape) and by the Expo
# Playwright run described in docs/knowledge/mobile-app.md.

definitions:
  mobile_note:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
        - status: {}
        - priority: {}
    fields:
      title: {}
      details: {}
      status:
        enum: ["open", "closed"]
      priority: {}
      amount: {}
      is_done: {}
      due_on:
        format: date
    required:
      - title
      - status
      - is_done

  mobile_log:
    x-generate:
      list: true
      view: true
      new: false
      edit: false
      delete: false
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - message:
            primary: true
    fields:
      message: {}
    required:
      - message
