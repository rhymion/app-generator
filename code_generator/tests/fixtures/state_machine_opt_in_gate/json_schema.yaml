$schema: "http://json-schema.org/draft-07/schema#"
format-version: 3.0

# Deliberately no top-level x-state-machines key at all -- this is the
# "opt-out" fixture for the Issue #696 Stage 1 PR2a-4 byte-identity gate.
# widget.status looks exactly like a state-transition-governed field (a
# plausible target for x-state-machines) but is never pointed to by one,
# proving the feature's presence in build_context.py/validate.py/
# api_import_route.ts.jinja2 leaves such a schema's generated output
# unaffected -- see test_state_machine_locked_fields_branches.py.

definitions:
  user:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    fields:
      name: {}
      email: {}

  widget:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-import-key:
      - name
    fields:
      name: {}
      status: {}
