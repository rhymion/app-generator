$schema: "http://json-schema.org/draft-07/schema#"
format-version: 3.0

# cmd_790: top-level, entity-agnostic bulk scheduled task -- no row
# selection, calls its handler directly once per run. Declared alongside an
# entity-level x-scheduled-task (on `widget` below) to prove both mechanisms
# coexist and feed one merged TASK_REGISTRY through the real
# build_user_schema.py -> generate.py pipeline, not just at the Jinja
# rendering level (see test_scheduled_task_templates.py for that).
x-scheduled-tasks:
  - task_id: demo_reset
    handler: resetDemo
    interval: "0 3 * * *"

definitions:
  user:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    fields:
      name: {}
      email: {}

  # Same-run control: an entity-level x-scheduled-task declaration, to prove
  # it still works unchanged and coexists with the top-level bulk task above.
  widget:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-scheduled-task:
      task_id: widget_timeout
      filter:
        status_in: ["pending"]
      handler: afterTimeout
      interval: "0 * * * *"
    fields:
      name: {}
      status:
        type: string
        enum: ["pending", "active"]
