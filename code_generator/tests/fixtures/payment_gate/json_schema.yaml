$schema: "http://json-schema.org/draft-07/schema#"
format-version: 3.0

definitions:
  user:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    fields:
      name: {}
      email: {}

  # The entity this fixture exists to exercise: x-payment: true must trigger
  # the write-once Stripe integration stubs (lib/stripe.ts, checkout route,
  # webhook route) and the record lifecycle (lib/payment/*, the payable
  # model). Its price is a per-record `amount_cents` field.
  paid_widget:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-payment: true
    fields:
      name: {}
      amount_cents: {}

  # A second x-payment entity, priced by a pre-created Stripe Price instead
  # (`stripe_price_id`): proves one webhook dispatches to the right entity
  # when more than one declares x-payment.
  paid_gadget:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-payment: true
    fields:
      name: {}
      stripe_price_id: {}

  # Same-run control: an entity with no x-payment key at all. The write-once
  # stubs are triggered by ANY entity in the schema declaring
  # x-payment: true (paid_widget above), not per-entity -- this entity
  # exists only to prove the scan reads the flag rather than firing
  # unconditionally on every definition.
  plain_widget:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    fields:
      name: {}
