# Fixture entities for the version-of-e2e-gate. ONLY what this gate needs:
# scripts/check_version_of_e2e_gate_fixture.sh merges them into a COPY of the
# default code_generator/json_schema.yaml inside a disposable build directory.
# The default schema, its generated output and every other fixture stay untouched.
#
#   vo_item               the identity entity; declares nothing about versions (it enables
#                         x-generate.invalidate, the way an identity is retired). Its Prisma
#                         model carries the nullable current_version_id and invalidated_at.
#   vo_item_version       the version entity: an ordinary x-approval entity plus
#                         x-version-of. Terminal rejection and withdrawal delete the draft.
#   vo_item_version_line  one level of owned children of a version.
definitions:
  vo_item:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: true
      api: true
      test: false
    x-display:
      table:
        - name:
            primary: true
    fields:
      name: {}
    required:
      - name

  vo_item_version_line:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
    required:
      - line_code
    fields:
      vo_item_version_id: {}
      line_code: {}
      note: {}
      quantity: {}

  vo_item_version:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
    x-display:
      table:
        - title:
            primary: true
    x-approval:
      submit_on:
        status: pending
      on_approved:
        set_fields:
          status: approved
      on_rejected:
        terminal: true
        set_fields:
          status: rejected
      on_withdrawn:
        set_fields:
          status: draft
    x-version-of:
      identity: vo_item
      number: version_no
    fields:
      vo_item_id:
        x-relationship:
          labelField: name
      title: {}
      summary: {}
      ref_code: {}
      version_no: {}
      status:
        enum:
          - draft
          - pending
          - approved
          - rejected
        default: draft
      approvable_id:
        x-relationship:
          type: one-to-one_bridge
          target: approvable
          labelField: id
      attachable_id:
        x-relationship:
          type: one-to-one_bridge
          labelField: id
    required:
      - vo_item_id
      - title
    properties:
      approvable:
        $ref: "#/definitions/approvable"
      attachable:
        $ref: "#/definitions/attachable"
      vo_item_version_lines:
        type: array
        items:
          $ref: "#/definitions/vo_item_version_line"
