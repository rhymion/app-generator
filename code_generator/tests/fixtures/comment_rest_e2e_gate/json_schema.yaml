# Fixture entity for the comment-rest-e2e-gate. ONLY the entity this gate needs:
# scripts/check_comment_rest_e2e_gate_fixture.sh merges it into a COPY of the default
# code_generator/json_schema.yaml inside a disposable build directory. The default schema
# (which has no entity with a comment thread), its generated output and every other fixture
# stay untouched.
#
#   cr_ticket   a commentable entity (one-to-one_bridge to `commentable`) with a foreign key to
#               organization, so its records are scoped by organization membership. `api: true`
#               generates the comment routes under /api/cr_ticket/{id}/comments; `test: true`
#               puts the entity in the generated test helpers' permission grant, which
#               `db:grantAllPermissions` uses (the generated entity specs are not run, except cr_note's, see below).
#   cr_memo     a commentable entity with NO organization column: its mentions (notifications and the @
#               candidate search) are not scoped by organization (mention_scope.cy.ts).
#   cr_asset    an entity that owns attachments through the `attachable` bridge (one-to-one_bridge to
#               `attachable` plus the AttachmentSection view / edit component), scoped by organization the
#               same way. `api: true` generates PUT /api/cr_asset/{id}/attachments.
#   cr_split    an `x-splittable` entity scoped by organization (no approval, no quantity: the API-only
#               form), for POST /api/cr_split/{id}/actions/split: the update-permission check and the
#               organization scoping of the split route.
#   cr_note     an entity scoped by organization with a required foreign key to cr_ref (also scoped by
#               organization), for fk_write_rest.cy.ts: a foreign key may only point at a row the caller can reach.
#   cr_group / cr_group_item
#               an organization-scoped parent with an inline child (read-only own pages) whose rows carry a foreign
#               key to cr_ref: the child rows are written only through the parent's own create / update, which
#               must apply the same foreign-key rule as cr_note (fk_write_nested.cy.ts).
#   cr_split_create / cr_split_read
#               the same shape with editing disabled (`edit: false`): the update permission can never
#               be assigned there, so the split route asks for `create` (cr_split_create, `new: true`)
#               or `read` (cr_split_read, `new: false` too).
definitions:
  cr_ticket:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
