$schema: "http://json-schema.org/draft-07/schema#"

definitions:
  db_table:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type:
          - string
          - "null"

  field:
    type: object
    required:
      - id
      - name
      - type
      - db_table_id
      - required
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      type:
        type: string
        enum:
          - string
          - number
          - boolean
          - date
      db_table_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      reference_id:
        type: 
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: db_table
          labelField: name
      max_length:
        type:
          - integer
          - "null"
        minimum: 1
      max:
        type:
          - integer
          - "null"
      regex:
        type:
          - string
          - "null"
      required:
        type: boolean
        default: true

  db_table_comment:
    type: object
    required:
      - id
      - message
      - db_table_id
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      message:
        type: string
        minLength: 1
      db_table_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"

  db_table_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/db_table"
      - type: object
        required:
          - fields
        properties:
          fields:
            type: array
            items:
              $ref: "#/definitions/field"
          db_table_comments:
            type: array
            x-outputType: comments
            items:
              $ref: "#/definitions/db_table_comment"

