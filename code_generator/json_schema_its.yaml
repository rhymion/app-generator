$schema: "http://json-schema.org/draft-07/schema#"

definitions:

  # ─── Common: Organization ──────────────────────────────────────────────────

  organization:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type:
          - string
          - "null"

  organization_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
    x-relationships:
      user_accounts:
        type: many-to-many
        target: user_account
    allOf:
      - $ref: "#/definitions/organization"
      - type: object
        required:
          - user_accounts
        properties:
          user_accounts:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/user_account"

  # ─── Common: Role ──────────────────────────────────────────────────────────

  role:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type:
          - string
          - "null"

  role_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
    x-relationships:
      user_accounts:
        type: many-to-many
        target: user_account
    allOf:
      - $ref: "#/definitions/role"
      - type: object
        required:
          - user_accounts
        properties:
          user_accounts:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/user_account"

  # ─── Common: User Account ──────────────────────────────────────────────────

  user_account:
    type: object
    required:
      - id
      - name
      - email
      - password
    x-display:
      table:
        - name:
            primary: true
            width: 150
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      email:
        type: string
      password:
        type: string
        x-custom-component:
          target:
            - upsert
      api_key:
        type:
          - string
          - "null"
        x-custom-component:
          target:
            - upsert
      avatar:
        type:
          - string
          - "null"
        format: uri

  user_account_detail:
    x-generate:
      list: true
      view: true
      new: false
      edit: true
      delete: true
      invalidate: false
      api: true
      fields:
        - name
        - avatar
        - roles
    x-relationships:
      roles:
        type: many-to-many
        target: role
    allOf:
      - $ref: "#/definitions/user_account"
      - type: object
        required:
          - roles
        properties:
          roles:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/role"

  # Setting: current user's own profile management (parent="setting", model="user_account")
  setting:
    x-generate:
      list: true
      view: true
      new: false
      edit: true
      delete: false
      invalidate: false
      api: true
    x-relationships:
      roles:
        type: many-to-many
        target: role
    allOf:
      - $ref: "#/definitions/user_account"
      - type: object
        required:
          - roles
        properties:
          roles:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/role"

  # ─── Common: Permission ────────────────────────────────────────────────────

  permission:
    type: object
    required:
      - id
      - name
      - create
      - read
      - update
      - delete
    x-display:
      table:
        - name:
            width: 200
        - role:
            width: 200
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      create:
        type: boolean
      read:
        type: boolean
      update:
        type: boolean
      delete:
        type: boolean
      role_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: role
          labelField: name

  permission_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
    allOf:
      - $ref: "#/definitions/permission"
      - type: object
        properties:
          role:
            $ref: "#/definitions/role"

  # ─── ITS: Epic ─────────────────────────────────────────────────────────────
  #
  # Top-level container. Belongs to an organization.
  # Hierarchy: Epic → Feature → User Story → Task

  epic:
    type: object
    required:
      - id
      - title
      - organization_id
      - status
    x-display:
      table:
        - title:
            primary: true
            width: 250
        - status:
            width: 120
        - organization:
            width: 150
        - start_date:
            width: 130
        - end_date:
            width: 130
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      title:
        type: string
        minLength: 1
        maxLength: 200
      description:
        type:
          - string
          - "null"
      organization_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: organization
          labelField: name
      status:
        type: integer
        minimum: 0
        maximum: 2
        enum:
          - Open
          - In Progress
          - Closed
      start_date:
        type:
          - string
          - "null"
        format: date
      end_date:
        type:
          - string
          - "null"
        format: date

  epic_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/epic"
      - type: object
        required:
          - organization
        properties:
          organization:
            $ref: "#/definitions/organization"

  # ─── ITS: Feature ──────────────────────────────────────────────────────────
  #
  # A feature or capability belonging to an Epic.

  feature:
    type: object
    required:
      - id
      - title
      - epic_id
      - status
    x-display:
      table:
        - title:
            primary: true
            width: 250
        - status:
            width: 120
        - epic:
            width: 200
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      title:
        type: string
        minLength: 1
        maxLength: 200
      description:
        type:
          - string
          - "null"
      epic_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: epic
          labelField: title
      status:
        type: integer
        minimum: 0
        maximum: 2
        enum:
          - Open
          - In Progress
          - Closed

  feature_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/feature"
      - type: object
        required:
          - epic
        properties:
          epic:
            $ref: "#/definitions/epic"

  # ─── ITS: Task (child of user_story — inline DataGrid, no standalone page) ─

  task:
    type: object
    required:
      - id
      - title
      - user_story_id
      - status
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      title:
        type: string
        minLength: 1
        maxLength: 200
      description:
        type:
          - string
          - "null"
      status:
        type: integer
        minimum: 0
        maximum: 2
        enum:
          - Todo
          - In Progress
          - Done
      # Parent FK — no x-relationship (generator identifies this by naming convention)
      user_story_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      assignee_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_account
          labelField: name

  # ─── ITS: User Story ───────────────────────────────────────────────────────
  #
  # A user-facing story belonging to a Feature.
  # Tasks are managed inline (DataGrid) within this entity's form.

  user_story:
    type: object
    required:
      - id
      - title
      - feature_id
      - status
      - priority
    x-display:
      table:
        - title:
            primary: true
            width: 250
        - status:
            width: 120
        - priority:
            width: 100
        - assignee:
            width: 150
        - feature:
            width: 200
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      title:
        type: string
        minLength: 1
        maxLength: 200
      description:
        type:
          - string
          - "null"
      feature_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: feature
          labelField: title
      status:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - Backlog
          - In Progress
          - Done
          - Closed
      priority:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - Low
          - Medium
          - High
          - Critical
      story_points:
        type:
          - integer
          - "null"
        minimum: 0
      assignee_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_account
          labelField: name

  user_story_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/user_story"
      - type: object
        required:
          - feature
          - tasks
        properties:
          feature:
            $ref: "#/definitions/feature"
          assignee:
            $ref: "#/definitions/user_account"
          tasks:
            type: array
            items:
              $ref: "#/definitions/task"

  # ─── ITS: Bug ──────────────────────────────────────────────────────────────
  #
  # A defect report. Optionally linked to a User Story.

  bug:
    type: object
    required:
      - id
      - title
      - status
      - severity
    x-display:
      table:
        - title:
            primary: true
            width: 250
        - status:
            width: 120
        - severity:
            width: 100
        - assignee:
            width: 150
        - user_story:
            width: 200
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      title:
        type: string
        minLength: 1
        maxLength: 200
      description:
        type:
          - string
          - "null"
      steps_to_reproduce:
        type:
          - string
          - "null"
      status:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - Open
          - In Progress
          - Resolved
          - Closed
      severity:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - Low
          - Medium
          - High
          - Critical
      user_story_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_story
          labelField: title
      assignee_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_account
          labelField: name

  bug_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/bug"
      - type: object
        properties:
          user_story:
            $ref: "#/definitions/user_story"
          assignee:
            $ref: "#/definitions/user_account"
