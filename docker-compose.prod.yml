# Local production services (postgres only).
# Redis is not needed for prod — the rate limiter falls back to in-memory
# when REDIS_URL is unset (see lib/rate-limit/index.ts).
services:
  postgres-prod:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: my_next_prod
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-prod-data:
    driver: local
