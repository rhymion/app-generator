name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - run: npm test

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    # The audit gate is mechanical: any high/critical CVE in production npm
    # deps or in the pip requirements file blocks merge. Dependabot is the
    # proactive half (see .github/dependabot.yml); this job is the
    # continuous half so non-Dependabot PRs can't introduce vulnerable deps
    # by accident. Policy lives in AGENTS.md ("Dependency auditing").
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: pip install (audit tool + project deps for resolution)
        run: pip install -r requirements.txt
      - name: pip-audit (requirements.txt)
        run: pip-audit -r requirements.txt

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache Cypress binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Create env file
        run: echo "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env.test.local
      - name: Generate code, start test database, push schema and build
        run: npm run test:e2e:build
      - name: Run API E2E tests
        run: npm run test:e2e:cy:start

  pytest:
    name: Python Generator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest code_generator/tests
