name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    # The audit gate is mechanical: any high/critical CVE in production npm
    # deps or in the pip requirements file blocks merge. Dependabot is the
    # proactive half (see .github/dependabot.yml); this job is the
    # continuous half so non-Dependabot PRs can't introduce vulnerable deps
    # by accident. Policy lives in AGENTS.md ("Dependency auditing").
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip install (audit tool + project deps for resolution)
        run: pip install -r requirements.txt
      - name: pip-audit (requirements.txt)
        run: pip-audit -r requirements.txt

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/my_next_test
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Start docker container for testing
        run: npm run docker:up:test
      - name: Copy required files for testing
        run: cp -a custom/sample/* .
      - name: Generate all (code generation and prisma client)
        run: npm run generate-code
      - name: Reset test database
        run: npm run migrate:reset:test
      - name: Run Cypress E2E tests
        run: npm run test:e2e
