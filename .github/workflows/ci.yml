name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify this diff as docs-only or not (machine-checked path judgment)
        # Path-based, not a human "this is docs-only" claim in the commit
        # message or PR text (cmd_498: "a condition the machine doesn't see
        # is a hole, not an exemption"). Only e2e-tests below is gated on
        # this job's output via needs:+if: (cmd_725: lint/unit-tests/audit/
        # audit-full-scope/pytest/mention-gate-fixture/decimal-gate-fixture/
        # oto-mandatory-gate-fixture/approval-lockdown-gate-fixture/
        # payment-gate-fixture keep running unconditionally — e2e-tests is
        # the dominant cost (~57-60 min per cmd_719) and the other ten stay
        # as a safety net against a path-judgment mistake here). Not a
        # top-level `paths-ignore:` trigger filter — that would make the
        # workflow (and its checks) not run at all for a docs-only push/PR,
        # indistinguishable in the PR Checks list from the check never
        # having existed. Gating the job instead makes it show up as
        # "Skipped" — visible, not silently absent.
        #
        # This repo's docs/ tree is not all documentation: docs/consumer-
        # commands/ holds the canonical source distributed to every
        # consumer repo's own CI workflow and gate definitions (ci.yml,
        # generate-schema.md, update-code.md, update-component.md) — editing
        # it is a change to what every consumer runs, not prose about this
        # repo. So it is checked and excluded from the docs-only exemption
        # BEFORE the general docs/** exclusion below, not folded into it:
        # git pathspec exclude magic has no re-include operator (a later
        # positive pathspec cannot carve a path back out of an earlier
        # ':(exclude)docs/**' — verified empirically, exclude always wins),
        # so a single combined pathspec list cannot express "docs/** except
        # docs/consumer-commands/**". AGENTS.md and .claude/commands/*.md
        # are excluded from this repo's exemption list for the same
        # reason — they carry this repo's own gate definitions (CLAUDE.md
        # "Gate SoT Rule") — but need no separate check: unlike
        # docs/consumer-commands/**, they were never added to the exclude
        # list below in the first place, so a change to either already
        # falls outside every ':(exclude)' pattern and is counted as a
        # real (non-docs) change by the general check on its own.
        id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No usable base commit (new branch or shallow history) — running the full suite (fail-closed)."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git diff --name-only "$BASE" HEAD -- docs/consumer-commands)" ]; then
            echo "docs/consumer-commands/** changed — this is the canonical source distributed to consumers, not docs-only."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BASE" HEAD -- . \
              ':(exclude)docs/**' \
              ':(exclude)README.md' ':(exclude)README_ja.md' \
              ':(exclude)CHANGELOG.md' ':(exclude)CLAUDE.md' \
              ':(exclude)LICENSE'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - run: npm run test:vitest

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    # The audit gate is mechanical: any high/critical CVE in production npm
    # deps or in the pip requirements file blocks merge. Dependabot is the
    # proactive half (see .github/dependabot.yml); this job is the
    # continuous half so non-Dependabot PRs can't introduce vulnerable deps
    # by accident. Policy lives in AGENTS.md ("Dependency auditing").
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: pip install (audit tool + project deps for resolution)
        run: pip install -r requirements.txt
      - name: pip-audit (requirements.txt)
        run: pip-audit -r requirements.txt

  audit-full-scope:
    name: Dependency Audit (full scope, non-blocking)
    runs-on: ubuntu-latest
    # Failsafe layer alongside the blocking `audit` job above. That job
    # scopes to --omit=dev so a high-severity CVE in a dev-only dependency
    # never blocks a merge — see docs/knowledge/dependency-bump-acceptance-
    # criteria.md (cmd_482): three dev-only high CVEs sat invisible on CI
    # for a week under that design, only found by manual audit. This job
    # closes that blind spot by auditing the full tree (prod + dev) at the
    # same --audit-level=high threshold, but never fails the run — findings
    # are surfaced via the job summary and a JSON artifact instead of a red
    # check. Who reviews this output and how often is documented in the
    # same doc; this job only produces the signal, it does not consume it.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - name: npm audit (full scope incl. devDependencies, high+, non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high --json > audit-full-scope.json
      - name: Summarize audit result (severity breakdown, step summary)
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            let data = {};
            try {
              data = JSON.parse(fs.readFileSync("audit-full-scope.json", "utf8"));
            } catch (e) {
              // Missing/invalid JSON (e.g. npm audit errored before it could
              // write a report) — surface as unknown rather than crash the step.
            }
            const v = (data.metadata && data.metadata.vulnerabilities) || {};
            const lines = [
              "## Full-scope npm audit (non-blocking, includes devDependencies)",
              "",
              "This job never fails the CI run. See `docs/knowledge/dependency-bump-acceptance-criteria.md` for who reviews this output and how often.",
              "",
              "| severity | count |",
              "|---|---|",
              `| critical | ${v.critical ?? "n/a"} |`,
              `| high | ${v.high ?? "n/a"} |`,
              `| moderate | ${v.moderate ?? "n/a"} |`,
              `| low | ${v.low ?? "n/a"} |`,
              `| **total** | **${v.total ?? "n/a"}** |`,
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - name: Upload audit JSON artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-full-scope
          path: audit-full-scope.json
          retention-days: 30

  e2e-tests:
    name: E2E Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate disposable test-only AUTH_SECRET (not a production secret)
        # AUTH_SECRET here is a throwaway value scoped to this CI run only —
        # it has no secrecy value and is never used outside the ephemeral
        # test environment, so it's generated in-workflow instead of read
        # from repository secrets. GitHub does not pass repository secrets
        # to Dependabot-authored `pull_request` runs (Dependabot has its
        # own, separate secrets store) or to fork PRs, so referencing
        # secrets.AUTH_SECRET here made CI unusable for those PRs: the
        # secret resolved empty, got written to .env.test.local anyway, and
        # only surfaced much later as an Auth.js MissingSecret failure deep
        # into the UI test suite. Generating the value removes CI's only
        # dependency on repository secrets and keeps behavior identical for
        # every PR type.
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> .env.test.local
      - name: Enable the test-only mock Google OAuth provider (cmd_527)
        # Registers an extra CredentialsProvider under id:"google" in
        # auth.ts, used only by cypress/e2e/auth/mfa.cy.ts to exercise the
        # OAuth+MFA code path without any real Google credentials or
        # outbound network call — see docs/knowledge/authentication.md
        # "MFA on the OAuth path". Safe to always set in this workflow:
        # this job only ever runs against the ephemeral CI test database,
        # never a real deployment, and the flag adds a provider, it never
        # removes or weakens one.
        #
        # This env var alone is NOT sufficient to register the provider
        # (cmd_528): auth.ts also requires the filesystem sentinel written
        # by scripts/write-mock-oauth-sentinel.js, which runs automatically
        # via the `pre*` hooks on the `test:e2e:build`/`test:e2e:cy:start`
        # npm scripts invoked below. Real deploy pipelines (`vercel-build`,
        # `build:full`) never run that script, so this flag alone leaking
        # into a real deployment's env vars can't enable the mock provider.
        run: echo "MOCK_GOOGLE_OAUTH_TEST=true" >> .env.test.local
      - name: Verify required test env is non-empty (fail-closed)
        # Guards right at env-generation time so a future accidental
        # regression back to an empty/undefined value fails fast here
        # instead of resurfacing as a confusing downstream test failure.
        run: |
          if [ -z "$(grep '^AUTH_SECRET=' .env.test.local | cut -d= -f2-)" ]; then
            echo "::error::AUTH_SECRET resolved empty in .env.test.local — refusing to continue."
            exit 1
          fi
      - name: Generate code, start test database, push schema and build
        run: npm run test:e2e:build
      - name: Run API E2E tests
        run: npm run test:e2e:cy:start

  pytest:
    name: Python Generator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest code_generator/tests

  mention-gate-fixture:
    name: Mention Gate Fixture Check
    runs-on: ubuntu-latest
    # cmd_535 (following cmd_532): a small fixture entity (commentable +
    # comment + x-mention: true) run through the real generate-code -> tsc
    # pipeline, catching regressions in the `named_constants and
    # has_commentable` branch of getters.ts.jinja2 / api_detail_route.ts.
    # jinja2 -- a branch this repo's own generate-code/build (the e2e-tests
    # job) never compiles, because no entity in this repo's own
    # json_schema.yaml wires a commentable relation. No path filter, same as
    # unit-tests/pytest above, per docs/knowledge/gate-exemption-must-be-
    # machine-checkable.md. See docs/knowledge/mention-system.md.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm run test:mention-gate

  decimal-gate-fixture:
    name: Decimal Gate Fixture Check
    runs-on: ubuntu-latest
    # cmd_705: a small fixture entity (required + nullable Decimal column,
    # each with an explicit @db.Decimal(p, s) scale) run through the real
    # generate-code -> tsc pipeline, catching regressions in the
    # Decimal-specific branches of schema_deriver.py / getters.ts.jinja2 /
    # form_upsert_context (generators.py) / form_validation.ts.jinja2 /
    # service_validation.ts.jinja2 / api_import_route.ts.jinja2 -- branches
    # this repo's own generate-code/build (the e2e-tests job) never
    # compiles, because no entity in this repo's own json_schema.yaml has a
    # Decimal-typed field. No path filter, same as unit-tests/pytest/
    # mention-gate-fixture above, per docs/knowledge/gate-exemption-must-be-
    # machine-checkable.md. See scripts/check_decimal_gate_fixture.sh.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm run test:decimal-gate

  oto-mandatory-gate-fixture:
    name: OTO Mandatory Gate Fixture Check
    runs-on: ubuntu-latest
    # cmd_704 [2-a]: a small fixture entity pair
    # (oto_gate_target, a one-to-one selector target with its own pages, and
    # oto_gate_item, whose FK to it is REQUIRED -- non-nullable) run through
    # the real generate-code -> tsc pipeline, catching regressions in the
    # required_relation_fields/selector_oto_rels split in build_context.py
    # and the `{{ f.init_var }}` reference it drives in page_new.tsx.jinja2
    # -- a branch this repo's own generate-code/build (the e2e-tests job)
    # never compiles, because no entity in this repo's own json_schema.yaml
    # has a required one-to-one selector FK, and neither does any currently
    # known consumer schema. No path filter, same as unit-tests/pytest/
    # mention-gate-fixture above, per docs/knowledge/gate-exemption-must-be-
    # machine-checkable.md. See scripts/check_oto_mandatory_gate_fixture.sh.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm run test:oto-mandatory-gate

  approval-lockdown-gate-fixture:
    name: Approval Lockdown Gate Fixture Check
    runs-on: ubuntu-latest
    # cmd_732: a small fixture entity (a nativeEnum status field with
    # x-approval.on_approved/on_rejected.set_fields declared on it) run
    # through the real generate-code -> tsc pipeline, catching regressions
    # in derive_approval_locked_values (helpers/schema_helpers.py), the
    # disabled-option rendering in form_upsert_context (generators.py), the
    # APPROVAL_LOCKED_FIELDS check in service_validation.ts.jinja2 (shared
    # by the REST API route and the Server Action write path), and its
    # duplicate in api_import_route.ts.jinja2 (CSV import bypasses the
    # service layer entirely) -- branches this repo's own generate-code/
    # build (the e2e-tests job) never compiles, because no entity in this
    # repo's own json_schema.yaml declares x-approval. No path filter, same
    # as unit-tests/pytest/mention-gate-fixture above, per docs/knowledge/
    # gate-exemption-must-be-machine-checkable.md. See
    # scripts/check_approval_lockdown_gate_fixture.sh.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm run test:approval-lockdown-gate

  payment-gate-fixture:
    name: Payment Gate Fixture Check
    runs-on: ubuntu-latest
    # cmd_753: a small fixture entity (x-payment: true) run through the real
    # generate-code -> tsc pipeline, catching regressions in the write-once
    # Stripe integration stub templates (stripe_lib_stub.ts.jinja2,
    # stripe_checkout_route_stub.ts.jinja2, stripe_webhook_route_stub.ts.
    # jinja2) -- including a stale Stripe SDK apiVersion literal, the exact
    # drift that motivated this gate (the stub pinned a literal that the
    # installed `stripe` SDK's own type no longer accepted). A branch this
    # repo's own generate-code/build (the e2e-tests job) never compiles,
    # because no entity in this repo's own json_schema.yaml declares
    # x-payment: true. No path filter, same as unit-tests/pytest/
    # mention-gate-fixture/decimal-gate-fixture/oto-mandatory-gate-fixture/
    # approval-lockdown-gate-fixture above, per docs/knowledge/gate-
    # exemption-must-be-machine-checkable.md. See
    # scripts/check_payment_gate_fixture.sh.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm run test:payment-gate
