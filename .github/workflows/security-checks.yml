name: Security Checks

# Secret scanning, dependency review and a rule-based code scan. See
# docs/knowledge/ci-security-workflows.md for what blocks and what only reports.
#
#   gitleaks           blocking   secrets added by a PR; full history on push and weekly
#   dependency-review  blocking   a PR that adds a dependency with a High/Critical advisory
#   semgrep            blocking for the project-owned rules in .semgrep/,
#                      report-only for the registry packs (results are uploaded)
#
# No job uses a secret. The checks are not path-filtered, so each one always
# reports a result on every PR and can be made a required check.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [master, main, develop]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The CLI binary is used directly: the gitleaks GitHub Action needs a
      # license for organizations.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      # A pull request is scanned over the commits it adds; every other trigger
      # scans the full history. Reviewed historical findings are listed with a
      # reason in .gitleaksignore.
      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ./gitleaks detect --source . --redact --no-banner --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"
          else
            ./gitleaks detect --source . --redact --no-banner --verbose
          fi

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
      - name: Install tools
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'semgrep==1.183.0' -r requirements.txt
      - name: Test the project-owned rules
        working-directory: .semgrep
        run: semgrep test .
      # Project-owned rules block. The registry packs (TypeScript, Next.js, OWASP
      # Top Ten) run too, but their findings are only uploaded.
      - name: Scan sources and a generated app
        run: bash scripts/semgrep_scan.sh --registry --out-dir semgrep-results
      - name: Summarize registry findings
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          print("### Semgrep registry findings (report-only)")
          for name in ("registry-sources", "registry-generated"):
              p = pathlib.Path("semgrep-results") / f"{name}.sarif"
              n = len(json.loads(p.read_text())["runs"][0]["results"]) if p.exists() else "no result"
              print(f"- {name}: {n}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results
          if-no-files-found: ignore
