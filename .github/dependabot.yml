# Dependabot configuration.
#
# Scans three ecosystems weekly:
#   - npm        : the Next.js app's runtime + dev deps.
#   - pip        : code_generator's Python build/test tooling.
#   - github-actions : workflow files under .github/workflows/.
#
# Strategy
# --------
# Security advisories produce PRs immediately (Dependabot does this
# regardless of `schedule`). Routine version bumps are grouped weekly so the
# reviewer load stays bounded — one PR per ecosystem per week instead of one
# PR per dependency.
#
# Major upgrades are split out (`update-types: ["major"]`) so a breaking bump
# never rides on the same PR as a minor or patch and surprises the gate.
#
# Exception: MUI major upgrades (`npm-mui-major`, cmd_537) are grouped into
# one PR across the whole `@mui/*` scope. MUI ships breaking major bumps
# across x-data-grid/x-date-pickers/icons-material/material/material-nextjs
# in near-lockstep, and reviewing them as four-plus separate major-bump PRs
# (each touching the same shared MUI theme/wrapper surface) was pure
# reviewer overhead without added safety — a single PR that upgrades the
# whole scope together is the actually-testable unit.
#
# Policy lives in AGENTS.md (`npm audit` + `pip-audit` in the per-task gates)
# so the audit also fires on every non-Dependabot change. Dependabot is the
# proactive half; the gate is the continuous half.
#
# target-branch: every ecosystem is listed twice (develop and main)
# -------------------------------------------------------------------
# Dependabot always reads its configuration from the repository's
# default branch (`main`), regardless of where `target-branch` points
# version-update PRs (confirmed empirically: PR #246 was raised against
# `main` on 2026-08-02T23:04Z, ~14h after a develop-only copy of this
# config had been merged into `develop` via PR #238 and never read). So
# the copy on `main` is the one that takes effect; `develop` receives the
# same file through the regular `main` -> `develop` back-merge.
#
# Each ecosystem has two entries with identical settings except
# `target-branch`: one raises routine version-update PRs against
# `develop` (the integration branch), the other against `main`, which is
# what running systems deploy from. Per GitHub's documented
# `target-branch` semantics, "only manifest files on the target branch
# are checked for version updates", so each entry scans its own branch.
# Security-update PRs (triggered by vulnerability alerts) always use the
# default branch (`main`) and ignore `target-branch`.
#
# Keep the `develop` and `main` entries of an ecosystem in sync when
# editing either: groups, `ignore` rules and `open-pull-requests-limit`
# are configured per entry, so they must be changed in both places.
#
# Exception: cypress is excluded from routine minor/patch grouping/updates
# (cmd_561, 2026-08-05). Root cause (cmd_551, confirmed via a single-variable
# isolated-worktree control experiment — cypress binary swapped alone,
# everything else held fixed): cypress 15.16.0 -> 15.19.0 alone breaks
# cypress/e2e/dashboard.cy.ts (`div[data-field="group_by_field"]` never
# found — a DataGrid column-virtualization/scrollIntoView timing change in
# Cypress itself, not a product-code or MUI regression). See
# docs/knowledge/testing-cypress.md for the full writeup. `exclude-patterns`
# alone only keeps cypress out of the weekly group PR — it still gets
# proposed as its own separate PR every week — so the `ignore:` block below
# additionally silences routine minor/patch bumps outright. Scoped to
# `update-types` minor/patch only, so a cypress CVE still reaches us via
# `npm-security` (ignore does not apply to security-update PRs).
#
# Exception: jsdom is likewise excluded from routine minor/patch
# grouping/updates (cmd_1128, 2026-09-21). Root cause (isolated-worktree
# single-variable control experiment on PR #699 — jsdom swapped alone,
# everything else held fixed): jsdom 30.0.1 -> 30.1.0 alone breaks
# components/_standard/{CardListClient,FormWithChildGrid,NotificationBell}.test.tsx
# (`TypeError: nodeToRestore.current.focus is not a function` inside MUI's
# FocusTrap cleanup). Confirmed upstream jsdom regression, not a
# product-code or MUI-template issue: jsdom/jsdom#4344 (closed 2026-09-21,
# "relatedTarget on a focus event is the Document object ... after the
# previously-focused element is removed from the DOM — regression since
# 30.1.0") and mui/material-ui#49159 (closed 2026-09-21 with no FocusTrap
# change — MUI's own maintainers: "this is a jsdom bug ... We will update
# jsdom as needed, when it's the case"). The upstream fix (jsdom/jsdom#4345,
# "Add focus fixup rule (rebased)") was still open/unmerged as of this
# writing, and no jsdom release newer than 30.1.0 exists yet. Debt: revisit
# once jsdom ships a release containing #4345 (or its successor) and
# re-verify the three test files above before removing this ignore entry.
# Scoped to `update-types` minor/patch only, so a jsdom CVE still reaches us
# via `npm-security` (ignore does not apply to security-update PRs).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "cypress"
          - "jsdom"
      npm-mui-major:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "@mui/*"
      npm-security:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
          - "major"
    ignore:
      # cmd_561, 2026-08-05: cypress minor/patch version-update alone broke
      # dashboard.cy.ts (see comment block above / testing-cypress.md).
      # Held back until a follow-up cmd re-verifies dashboard.cy.ts against
      # a newer cypress. Does not suppress security-update PRs.
      - dependency-name: "cypress"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # cmd_1128, 2026-09-21: jsdom 30.1.0 regression (see comment block
      # above / this cmd's report). Held back until jsdom ships a release
      # containing jsdom/jsdom#4345 (or its successor) and the three
      # affected test files are re-verified. Does not suppress
      # security-update PRs.
      - dependency-name: "jsdom"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    labels:
      - "dependencies"
      - "npm"

  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "cypress"
          - "jsdom"
      npm-mui-major:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "@mui/*"
      npm-security:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
          - "major"
    ignore:
      # cmd_561, 2026-08-05: cypress minor/patch version-update alone broke
      # dashboard.cy.ts (see comment block above / testing-cypress.md).
      # Held back until a follow-up cmd re-verifies dashboard.cy.ts against
      # a newer cypress. Does not suppress security-update PRs.
      - dependency-name: "cypress"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # cmd_1128, 2026-09-21: jsdom 30.1.0 regression (see comment block
      # above / this cmd's report). Held back until jsdom ships a release
      # containing jsdom/jsdom#4345 (or its successor) and the three
      # affected test files are re-verified. Does not suppress
      # security-update PRs.
      - dependency-name: "jsdom"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    labels:
      - "dependencies"
      - "npm"

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      pip-security:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
          - "major"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      pip-security:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
          - "major"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      actions-all:
        update-types:
          - "minor"
          - "patch"
          - "major"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      actions-all:
        update-types:
          - "minor"
          - "patch"
          - "major"
    labels:
      - "dependencies"
      - "github-actions"
