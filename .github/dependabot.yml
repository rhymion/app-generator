# Dependabot configuration.
#
# Scans three ecosystems weekly:
#   - npm        : the Next.js app's runtime + dev deps.
#   - pip        : code_generator's Python build/test tooling.
#   - github-actions : workflow files under .github/workflows/.
#
# Strategy
# --------
# Security advisories produce PRs immediately (Dependabot does this
# regardless of `schedule`). Routine version bumps are grouped weekly so the
# reviewer load stays bounded — one PR per ecosystem per week instead of one
# PR per dependency.
#
# Major upgrades are split out (`update-types: ["major"]`) so a breaking bump
# never rides on the same PR as a minor or patch and surprises the gate.
#
# Exception: MUI major upgrades (`npm-mui-major`, cmd_537) are grouped into
# one PR across the whole `@mui/*` scope. MUI ships breaking major bumps
# across x-data-grid/x-date-pickers/icons-material/material/material-nextjs
# in near-lockstep, and reviewing them as four-plus separate major-bump PRs
# (each touching the same shared MUI theme/wrapper surface) was pure
# reviewer overhead without added safety — a single PR that upgrades the
# whole scope together is the actually-testable unit.
#
# Policy lives in AGENTS.md (`npm audit` + `pip-audit` in the per-task gates)
# so the audit also fires on every non-Dependabot change. Dependabot is the
# proactive half; the gate is the continuous half.
#
# target-branch: develop — this copy is NOT the one Dependabot reads
# --------------------------------------------------------------------
# Dependabot always reads its configuration from the repository's
# GitHub-configured default branch (`main`), regardless of where
# `target-branch` points version-update PRs (confirmed empirically: PR
# #246 was raised against `main` on 2026-08-02T23:04Z, ~14h after this
# exact config had already been merged into `develop` via PR #238 — the
# develop-only copy was never read). The AUTHORITATIVE copy lives on
# `main` (`.github/dependabot.yml` there); keep both in sync when editing
# either. This copy exists on `develop` only for readability/consistency
# in that branch's tree.
#
# All three ecosystems raise routine version-update PRs against `develop`
# (the repo's actual merge target — see CLAUDE.md D009 / develop-is-
# standard-merge-target policy), not `main`. Per GitHub's documented
# `target-branch` semantics, this applies to version updates only:
# security-update PRs (triggered by vulnerability alerts) are always
# raised against the default branch regardless of `target-branch`. As
# long as the default branch stays `main`, a security-advisory PR will
# still land on `main` and needs manual retargeting/porting to `develop`.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      npm-mui-major:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "@mui/*"
      npm-security:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
          - "major"
    labels:
      - "dependencies"
      - "npm"

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      pip-security:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
          - "major"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      actions-all:
        update-types:
          - "minor"
          - "patch"
          - "major"
    labels:
      - "dependencies"
      - "github-actions"
