services:
  postgres-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    image: app-postgres-bigm:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: my_next_test
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    # Backs the rate-limit adapter for Cypress and Redis adapter unit tests
    # (lib/rate-limit/redis.test.ts). Not used by `npm run dev` — dev
    # falls back to in-memory rate limiting when REDIS_URL is unset.
    # No persistence — the dataset is rebuilt on every test run anyway,
    # and disabling AOF/snapshotting keeps the container quiet.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-test-data:
    driver: local
