$schema: "http://json-schema.org/draft-07/schema#"

definitions:
  # ============================================================
  # System entities (required by all apps — see §1.1)
  # Keep these definitions intact when creating a new app.
  # ============================================================

  user_account:
    type: object
    required:
      - id
      - name
      - email
      - password
    x-display:
      table:
        - name:
            primary: true
            width: 150
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      email:
        type: string
      password:
        type: string
        x-custom-component:
          target:
            - upsert
      api_key:
        type:
          - string
          - "null"
        x-custom-component:
          target:
            - upsert
      avatar:
        type:
          - string
          - "null"
        format: uri

  role:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type:
          - string
          - "null"

  user_account_detail:
    x-generate:
      list: true
      view: true
      new: false
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
      fields:
        - name
        - avatar
        - roles
    x-relationships:
      roles:
        type: many-to-many
        target: role
    allOf:
      - $ref: "#/definitions/user_account"
      - type: object
        required:
          - roles
        properties:
          roles:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/role"

  setting:
    x-generate:
      list: true
      view: true
      new: false
      edit: true
      delete: false
      invalidate: false
      api: true
    x-relationships:
      roles:
        type: many-to-many
        target: role
    allOf:
      - $ref: "#/definitions/user_account"
      - type: object
        required:
          - roles
        properties:
          roles:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/role"

  role_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    x-relationships:
      user_accounts:
        type: many-to-many
        target: user_account
    allOf:
      - $ref: "#/definitions/role"
      - type: object
        required:
          - user_accounts
        properties:
          user_accounts:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/user_account"

  organization:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type:
          - string
          - "null"

  organization_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    x-relationships:
      user_accounts:
        type: many-to-many
        target: user_account
    allOf:
      - $ref: "#/definitions/organization"
      - type: object
        required:
          - user_accounts
        properties:
          user_accounts:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/user_account"

  permission:
    type: object
    required:
      - id
      - name
      - create
      - read
      - update
      - delete
    x-display:
      table:
        - name:
            width: 200
        - role:
            width: 200
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      create:
        type: boolean
      read:
        type: boolean
      update:
        type: boolean
      delete:
        type: boolean
      role_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: role
          labelField: name

  permission_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/permission"
      - type: object
        properties:
          role:
            $ref: "#/definitions/role"

  # ============================================================
  # ITS ticket hierarchy: Epic → Feature → User Story → Task
  # Bugs can optionally belong to a Feature or User Story.
  # ============================================================

  epic:
    type: object
    required: [id, name, status, priority, organization_id]
    x-display:
      table:
        - name:
            primary: true
            width: 280
        - status:
            width: 130
        - priority:
            width: 110
        - assignee:
            width: 170
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type:
          - string
          - "null"
      status:
        type: integer
        minimum: 0
        maximum: 5
        enum:
          - Backlog
          - Todo
          - In Progress
          - In Review
          - Done
          - Cancelled
      priority:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - Low
          - Medium
          - High
          - Critical
      organization_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: organization
          labelField: name
      assignee_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_account
          labelField: name

  epic_comment:
    type: object
    required: [id, message, epic_id]
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      message:
        type: string
        minLength: 1
      epic_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"

  epic_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/epic"
      - type: object
        required:
          - organization
        properties:
          organization:
            $ref: "#/definitions/organization"
          assignee:
            $ref: "#/definitions/user_account"
          epic_comments:
            type: array
            x-outputType: comments
            items:
              $ref: "#/definitions/epic_comment"

  # ────────────────────────────────────────

  feature:
    type: object
    required: [id, name, status, priority, epic_id, organization_id]
    x-display:
      table:
        - name:
            primary: true
            width: 250
        - epic:
            width: 180
        - status:
            width: 130
        - priority:
            width: 110
        - assignee:
            width: 170
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type:
          - string
          - "null"
      status:
        type: integer
        minimum: 0
        maximum: 5
        enum:
          - Backlog
          - Todo
          - In Progress
          - In Review
          - Done
          - Cancelled
      priority:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - Low
          - Medium
          - High
          - Critical
      epic_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: epic
          labelField: name
      organization_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: organization
          labelField: name
      assignee_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_account
          labelField: name

  feature_comment:
    type: object
    required: [id, message, feature_id]
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      message:
        type: string
        minLength: 1
      feature_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"

  feature_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/feature"
      - type: object
        required:
          - epic
          - organization
        properties:
          epic:
            $ref: "#/definitions/epic"
          organization:
            $ref: "#/definitions/organization"
          assignee:
            $ref: "#/definitions/user_account"
          feature_comments:
            type: array
            x-outputType: comments
            items:
              $ref: "#/definitions/feature_comment"

  # ────────────────────────────────────────

  user_story:
    type: object
    required: [id, name, status, priority, feature_id, organization_id]
    x-display:
      table:
        - name:
            primary: true
            width: 250
        - feature:
            width: 180
        - status:
            width: 130
        - priority:
            width: 110
        - assignee:
            width: 170
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type:
          - string
          - "null"
      status:
        type: integer
        minimum: 0
        maximum: 5
        enum:
          - Backlog
          - Todo
          - In Progress
          - In Review
          - Done
          - Cancelled
      priority:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - Low
          - Medium
          - High
          - Critical
      feature_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: feature
          labelField: name
      organization_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: organization
          labelField: name
      assignee_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_account
          labelField: name

  user_story_comment:
    type: object
    required: [id, message, user_story_id]
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      message:
        type: string
        minLength: 1
      user_story_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"

  user_story_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/user_story"
      - type: object
        required:
          - feature
          - organization
        properties:
          feature:
            $ref: "#/definitions/feature"
          organization:
            $ref: "#/definitions/organization"
          assignee:
            $ref: "#/definitions/user_account"
          user_story_comments:
            type: array
            x-outputType: comments
            items:
              $ref: "#/definitions/user_story_comment"

  # ────────────────────────────────────────

  task:
    type: object
    required: [id, name, status, priority, user_story_id, organization_id]
    x-display:
      table:
        - name:
            primary: true
            width: 250
        - user_story:
            width: 200
        - status:
            width: 130
        - priority:
            width: 110
        - assignee:
            width: 170
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type:
          - string
          - "null"
      status:
        type: integer
        minimum: 0
        maximum: 5
        enum:
          - Backlog
          - Todo
          - In Progress
          - In Review
          - Done
          - Cancelled
      priority:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - Low
          - Medium
          - High
          - Critical
      user_story_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_story
          labelField: name
      organization_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: organization
          labelField: name
      assignee_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_account
          labelField: name

  task_comment:
    type: object
    required: [id, message, task_id]
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      message:
        type: string
        minLength: 1
      task_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"

  task_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/task"
      - type: object
        required:
          - user_story
          - organization
        properties:
          user_story:
            $ref: "#/definitions/user_story"
          organization:
            $ref: "#/definitions/organization"
          assignee:
            $ref: "#/definitions/user_account"
          task_comments:
            type: array
            x-outputType: comments
            items:
              $ref: "#/definitions/task_comment"

  # ────────────────────────────────────────
  # Bug — optionally linked to a Feature or User Story

  bug:
    type: object
    required: [id, name, status, priority, organization_id]
    x-display:
      table:
        - name:
            primary: true
            width: 250
        - status:
            width: 130
        - priority:
            width: 110
        - feature:
            width: 160
        - assignee:
            width: 170
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type:
          - string
          - "null"
      status:
        type: integer
        minimum: 0
        maximum: 5
        enum:
          - Backlog
          - Todo
          - In Progress
          - In Review
          - Done
          - Cancelled
      priority:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - Low
          - Medium
          - High
          - Critical
      organization_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: organization
          labelField: name
      feature_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: feature
          labelField: name
      user_story_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_story
          labelField: name
      assignee_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_account
          labelField: name

  bug_comment:
    type: object
    required: [id, message, bug_id]
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      message:
        type: string
        minLength: 1
      bug_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"

  bug_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/bug"
      - type: object
        required:
          - organization
        properties:
          organization:
            $ref: "#/definitions/organization"
          feature:
            $ref: "#/definitions/feature"
          user_story:
            $ref: "#/definitions/user_story"
          assignee:
            $ref: "#/definitions/user_account"
          bug_comments:
            type: array
            x-outputType: comments
            items:
              $ref: "#/definitions/bug_comment"

