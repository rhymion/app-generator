$schema: "http://json-schema.org/draft-07/schema#"

definitions:
  # ============================================================
  # Common models (same across all apps)
  # ============================================================

  user_account:
    type: object
    required:
      - id
      - name
      - email
      - password
    x-display:
      table:
        - name:
            primary: true
            width: 150
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      email:
        type: string
      password:
        type: string
        x-custom-component:
          target:
            - upsert
      api_key:
        type:
          - string
          - "null"
        x-custom-component:
          target:
            - upsert
      avatar:
        type:
          - string
          - "null"
        format: uri

  role:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type:
          - string
          - "null"

  user_account_detail:
    x-generate:
      list: true
      view: true
      new: false
      edit: true
      delete: true
      invalidate: false
      api: true
      test: false
      fields:
        - name
        - avatar
        - roles
    x-relationships:
      roles:
        type: many-to-many
        target: role
    allOf:
      - $ref: "#/definitions/user_account"
      - type: object
        required:
          - roles
        properties:
          roles:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/role"

  setting:
    x-generate:
      list: true
      view: true
      new: false
      edit: true
      delete: false
      invalidate: false
      api: true
    x-relationships:
      roles:
        type: many-to-many
        target: role
    allOf:
      - $ref: "#/definitions/user_account"
      - type: object
        required:
          - roles
        properties:
          roles:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/role"

  role_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    x-relationships:
      user_accounts:
        type: many-to-many
        target: user_account
    allOf:
      - $ref: "#/definitions/role"
      - type: object
        required:
          - user_accounts
        properties:
          user_accounts:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/user_account"

  organization:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type:
          - string
          - "null"

  organization_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    x-relationships:
      user_accounts:
        type: many-to-many
        target: user_account
    allOf:
      - $ref: "#/definitions/organization"
      - type: object
        required:
          - user_accounts
        properties:
          user_accounts:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/user_account"

  permission:
    type: object
    required:
      - id
      - name
      - create
      - read
      - update
      - delete
    x-display:
      table:
        - name:
            width: 200
        - role:
            width: 200
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      create:
        type: boolean
      read:
        type: boolean
      update:
        type: boolean
      delete:
        type: boolean
      role_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: role
          labelField: name

  permission_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/permission"
      - type: object
        properties:
          role:
            $ref: "#/definitions/role"

  # ============================================================
  # ITS models
  # ============================================================

  epic:
    type: object
    required:
      - id
      - name
      - organization_id
      - status
      - priority
    x-display:
      table:
        - name:
            primary: true
            width: 250
        - status:
            width: 120
        - priority:
            width: 100
        - due_date:
            width: 130
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      organization_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: organization
          labelField: name
      description:
        type:
          - string
          - "null"
      status:
        type: integer
        minimum: 0
        maximum: 5
        enum:
          - Backlog
          - Todo
          - In Progress
          - In Review
          - Done
          - Cancelled
      priority:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - Low
          - Medium
          - High
          - Critical
      due_date:
        type:
          - string
          - "null"
        format: date

  feature:
    type: object
    required:
      - id
      - name
      - epic_id
      - status
      - priority
    x-display:
      table:
        - name:
            primary: true
            width: 250
        - epic:
            width: 150
        - status:
            width: 120
        - priority:
            width: 100
        - due_date:
            width: 130
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      epic_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: epic
          labelField: name
      description:
        type:
          - string
          - "null"
      status:
        type: integer
        minimum: 0
        maximum: 5
        enum:
          - Backlog
          - Todo
          - In Progress
          - In Review
          - Done
          - Cancelled
      priority:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - Low
          - Medium
          - High
          - Critical
      assignee_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_account
          labelField: name
      due_date:
        type:
          - string
          - "null"
        format: date

  user_story:
    type: object
    required:
      - id
      - name
      - feature_id
      - status
      - priority
    x-display:
      table:
        - name:
            primary: true
            width: 250
        - feature:
            width: 150
        - status:
            width: 120
        - priority:
            width: 100
        - story_points:
            width: 80
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      feature_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: feature
          labelField: name
      description:
        type:
          - string
          - "null"
      status:
        type: integer
        minimum: 0
        maximum: 5
        enum:
          - Backlog
          - Todo
          - In Progress
          - In Review
          - Done
          - Cancelled
      priority:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - Low
          - Medium
          - High
          - Critical
      story_points:
        type:
          - integer
          - "null"
        minimum: 1
      assignee_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_account
          labelField: name

  task:
    type: object
    required:
      - id
      - name
      - user_story_id
      - status
      - priority
    x-display:
      table:
        - name:
            primary: true
            width: 250
        - user_story:
            width: 150
        - assignee:
            width: 130
        - status:
            width: 120
        - priority:
            width: 100
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      user_story_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_story
          labelField: name
      description:
        type:
          - string
          - "null"
      status:
        type: integer
        minimum: 0
        maximum: 5
        enum:
          - Backlog
          - Todo
          - In Progress
          - In Review
          - Done
          - Cancelled
      priority:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - Low
          - Medium
          - High
          - Critical
      assignee_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_account
          labelField: name
      due_date:
        type:
          - string
          - "null"
        format: date

  bug:
    type: object
    required:
      - id
      - name
      - status
      - priority
      - severity
    x-display:
      table:
        - name:
            primary: true
            width: 250
        - severity:
            width: 100
        - status:
            width: 120
        - priority:
            width: 100
        - assignee:
            width: 130
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type:
          - string
          - "null"
      status:
        type: integer
        minimum: 0
        maximum: 5
        enum:
          - Backlog
          - Todo
          - In Progress
          - In Review
          - Done
          - Cancelled
      priority:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - Low
          - Medium
          - High
          - Critical
      severity:
        type: integer
        minimum: 0
        maximum: 3
        enum:
          - Minor
          - Major
          - Critical
          - Blocker
      feature_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: feature
          labelField: name
      user_story_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_story
          labelField: name
      assignee_id:
        type:
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: user_account
          labelField: name
      due_date:
        type:
          - string
          - "null"
        format: date

  epic_comment:
    type: object
    required:
      - id
      - message
      - epic_id
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      message:
        type: string
        minLength: 1
      epic_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"

  feature_comment:
    type: object
    required:
      - id
      - message
      - feature_id
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      message:
        type: string
        minLength: 1
      feature_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"

  user_story_comment:
    type: object
    required:
      - id
      - message
      - user_story_id
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      message:
        type: string
        minLength: 1
      user_story_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"

  task_comment:
    type: object
    required:
      - id
      - message
      - task_id
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      message:
        type: string
        minLength: 1
      task_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"

  bug_comment:
    type: object
    required:
      - id
      - message
      - bug_id
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      message:
        type: string
        minLength: 1
      bug_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"

  # ============================================================
  # ITS detail definitions (drive code generation)
  # ============================================================

  epic_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/epic"
      - type: object
        required:
          - organization
          - features
        properties:
          organization:
            $ref: "#/definitions/organization"
          features:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/feature"
          epic_comments:
            type: array
            x-outputType: comments
            items:
              $ref: "#/definitions/epic_comment"

  feature_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/feature"
      - type: object
        required:
          - epic
          - user_stories
        properties:
          epic:
            $ref: "#/definitions/epic"
          assignee:
            $ref: "#/definitions/user_account"
          user_stories:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/user_story"
          bugs:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/bug"
          feature_comments:
            type: array
            x-outputType: comments
            items:
              $ref: "#/definitions/feature_comment"

  user_story_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/user_story"
      - type: object
        required:
          - feature
          - tasks
        properties:
          feature:
            $ref: "#/definitions/feature"
          assignee:
            $ref: "#/definitions/user_account"
          tasks:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/task"
          bugs:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/bug"
          user_story_comments:
            type: array
            x-outputType: comments
            items:
              $ref: "#/definitions/user_story_comment"

  task_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/task"
      - type: object
        required:
          - user_story
        properties:
          user_story:
            $ref: "#/definitions/user_story"
          assignee:
            $ref: "#/definitions/user_account"
          task_comments:
            type: array
            x-outputType: comments
            items:
              $ref: "#/definitions/task_comment"

  bug_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
    allOf:
      - $ref: "#/definitions/bug"
      - type: object
        properties:
          feature:
            $ref: "#/definitions/feature"
          user_story:
            $ref: "#/definitions/user_story"
          assignee:
            $ref: "#/definitions/user_account"
          bug_comments:
            type: array
            x-outputType: comments
            items:
              $ref: "#/definitions/bug_comment"
