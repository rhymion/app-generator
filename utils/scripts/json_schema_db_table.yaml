$schema: "http://json-schema.org/draft-07/schema#"

definitions:
  xxxxx_xxxxx:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type:
          - string
          - "null"
      team:
        type:
          - string
          - "null"

  yyyyy_yyyyy:
    type: object
    required:
      - id
      - name
      - type
      - xxxxx_xxxxx_id
      - required
      - written_by
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      type:
        type: string
        enum:
          - string
          - number
          - boolean
          - date
      xxxxx_xxxxx_id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      max_length:
        type:
          - integer
          - "null"
        minimum: 1
      max:
        type:
          - integer
          - "null"
      regex:
        type:
          - string
          - "null"
      required:
        type: boolean
        default: true
      written_by:
        type: string

  xxxxx_xxxxx_detail:
    allOf:
      - $ref: "#/definitions/xxxxx_xxxxx"
      - type: object
        required:
          - yyyyy_yyyyys
        properties:
          yyyyy_yyyyys:
            type: array
            items:
              $ref: "#/definitions/yyyyy_yyyyy"
