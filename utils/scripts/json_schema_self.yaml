$schema: "http://json-schema.org/draft-07/schema#"

definitions:
  procedure:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
        pattern: "^c[a-z0-9]{24,}$"
      name:
        type: string
        minLength: 1
      description:
        type: 
          - string
          - "null"
      parent_id:
        type: 
          - string
          - "null"
        pattern: "^c[a-z0-9]{24,}$"
        x-relationship:
          type: many-to-one
          target: procedure
          labelField: name

  procedure_detail:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
    x-relationships:
      preceded_by:
        type: many-to-many
        target: procedure
      followed_by:
        type: many-to-many
        target: procedure
    allOf:
      - $ref: "#/definitions/procedure"
      - type: object
        required:
          - children
          - preceded_by
          - followed_by
        properties:
          parent:
            $ref: "#/definitions/procedure"
          children:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/procedure"
          preceded_by:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/procedure"
          followed_by:
            type: array
            x-outputType: list
            items:
              $ref: "#/definitions/procedure"
